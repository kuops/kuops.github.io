<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 467" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">phox.1: 文件偏移到内存映像</text>

  <g transform="translate(20,55)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#94a3b8">磁盘文件 (FOA)</text>
    <text x="520" y="0" font-size="14" font-weight="bold" fill="#94a3b8">内存映像 (RVA / VA)</text>

    <rect x="0" y="20" width="360" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="14" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">0x0000 - 0x03FF</text>
    <text x="175" y="45" font-size="13" font-weight="bold" fill="#94a3b8">DOS / PE 头与节表</text>

    <rect x="520" y="20" width="400" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="536" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">0x400000 - 0x400FFF</text>
    <text x="770" y="45" font-size="13" font-weight="bold" fill="#94a3b8">PE 头页</text>

    <line x1="360" y1="40" x2="520" y2="40" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="514,36 520,40 514,44" fill="#94a3b8"/>

    <rect x="0" y="80" width="360" height="62" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="14" y="106" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">.text  FOA 0x400 - 0xBFF</text>
    <text x="14" y="129" font-size="12" font-weight="bold" fill="#94a3b8">原始大小 0x800，入口点位于 FOA 0x850</text>

    <rect x="520" y="80" width="400" height="62" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="536" y="106" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">RVA 0x1000 / VA 0x401000</text>
    <text x="536" y="129" font-size="12" font-weight="bold" fill="#94a3b8">x32dbg: ER-，按 0x1000 对齐</text>

    <line x1="360" y1="111" x2="520" y2="111" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <polygon points="514,107 520,111 514,115" fill="#3b82f6"/>

    <rect x="0" y="160" width="360" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="14" y="186" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">.rdata  FOA 0xC00 - 0x11FF</text>
    <text x="14" y="204" font-size="11" font-weight="bold" fill="#94a3b8">导入相关数据也位于此节</text>

    <rect x="520" y="160" width="400" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="536" y="186" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">RVA 0x2000 / VA 0x402000</text>
    <text x="536" y="204" font-size="11" font-weight="bold" fill="#94a3b8">x32dbg: .rdata，IDA 会单独显示部分 .idata</text>

    <line x1="360" y1="186" x2="520" y2="186" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="514,182 520,186 514,190" fill="#94a3b8"/>

    <rect x="0" y="230" width="360" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="14" y="256" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">.data  FOA 0x1200 - 0x13FF</text>
    <text x="14" y="274" font-size="11" font-weight="bold" fill="#94a3b8">可写全局数据与字符串</text>

    <rect x="520" y="230" width="400" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="536" y="256" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">RVA 0x3000 / VA 0x403000</text>
    <text x="536" y="274" font-size="11" font-weight="bold" fill="#94a3b8">x32dbg: -RW</text>

    <line x1="360" y1="256" x2="520" y2="256" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="514,252 520,256 514,260" fill="#94a3b8"/>

    <rect x="0" y="300" width="360" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="14" y="326" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">.rsrc  FOA 0x1400 - 0x15FF</text>
    <text x="14" y="344" font-size="11" font-weight="bold" fill="#94a3b8">资源数据</text>

    <rect x="520" y="300" width="400" height="52" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="536" y="326" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">RVA 0x4000 / VA 0x404000</text>
    <text x="536" y="344" font-size="11" font-weight="bold" fill="#94a3b8">有效 VA 0x400000 - 0x404FFF</text>

    <line x1="360" y1="326" x2="520" y2="326" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="514,322 520,326 514,330" fill="#94a3b8"/>
  </g>

  <g transform="translate(20,423)">
    <rect x="0" y="0" width="900" height="24" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="450" y="17" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">FOA 0x850  &lt;-&gt;  RVA 0x1450  &lt;-&gt;  VA 0x401450</text>
  </g>
</svg>
