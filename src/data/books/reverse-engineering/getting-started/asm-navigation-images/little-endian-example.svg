<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">小端序与大端序对比</text>

  <g transform="translate(0, 60)">
    <text x="25" y="35" font-size="14" font-weight="bold" fill="#94a3b8">16进制 8位 (数值1)</text>

    <rect x="200" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="237.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>

    <rect x="285" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="322.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>

    <rect x="370" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="407.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>

    <rect x="455" y="10" width="75" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="492.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">01</text>
  </g>

  <g transform="translate(0, 130)">
    <text x="25" y="35" font-size="14" font-weight="bold" fill="#3b82f6">小端序 (x86内存)</text>

    <rect x="200" y="10" width="75" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="237.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">01</text>
    <text x="237.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004000</text>

    <rect x="285" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="322.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>
    <text x="322.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004001</text>

    <rect x="370" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="407.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>
    <text x="407.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004002</text>

    <rect x="455" y="10" width="75" height="40" rx="4" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="492.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">00</text>
    <text x="492.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004003</text>

    <text x="550" y="35" font-size="13" font-weight="bold" fill="#ef4444">← 反过来</text>
  </g>

  <g transform="translate(0, 210)">
    <text x="25" y="35" font-size="14" font-weight="bold" fill="#94a3b8">大端序</text>

    <rect x="200" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="237.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>
    <text x="237.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004000</text>

    <rect x="285" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="322.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>
    <text x="322.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004001</text>

    <rect x="370" y="10" width="75" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="407.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">00</text>
    <text x="407.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004002</text>

    <rect x="455" y="10" width="75" height="40" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="492.5" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">01</text>
    <text x="492.5" y="68" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0x004003</text>
  </g>

  <g transform="translate(25, 300)">
    <rect x="0" y="0" width="710" height="50" rx="6" fill="#3b82f6" fill-opacity="0.04" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="20" y="30" font-size="14" font-weight="bold" fill="#3b82f6">💡 小端序口诀：</text>
    <text x="135" y="30" font-size="14" font-weight="bold" fill="#94a3b8">
      低位字节(<tspan fill="#10b981">01</tspan>)放在低地址，高位字节(<tspan fill="#64748b">00</tspan>)放在高地址。所以内存顺序看起来是反的。
    </text>
  </g>
</svg>
