<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="40" y="30">bit 31</text>
    <text x="360" y="30">bit 16</text>
    <text x="360" y="42" font-size="10" opacity="0.7">bit 15</text>
    <text x="520" y="30">bit 8</text>
    <text x="520" y="42" font-size="10" opacity="0.7">bit 7</text>
    <text x="680" y="30">bit 0</text>
  </g>

  <rect x="40" y="55" width="640" height="50" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="200" y="86" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="600">高 16 位</text>

  <rect x="360" y="55" width="320" height="50" rx="6" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="520" y="86" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold">AX（16 位）</text>

  <path d="M360 112 L360 122 L680 122 L680 112" fill="none" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2,2"/>

  <rect x="360" y="135" width="160" height="44" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="440" y="162" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">AH（8 位）</text>

  <rect x="520" y="135" width="160" height="44" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="600" y="162" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">AL（8 位）</text>

  <line x1="360" y1="200" x2="680" y2="200" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <text x="40" y="222" font-size="13" font-weight="600" fill="#475569">示例：EAX = 0x12345678</text>

  <rect x="40" y="235" width="160" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="200" y="235" width="160" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="360" y="235" width="160" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="520" y="235" width="160" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="120" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">12</text>
  <text x="280" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">34</text>
  <text x="440" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#d97706">56</text>
  <text x="475" y="255" font-size="11" font-weight="normal" fill="#d97706" opacity="0.7">(AH)</text>
  <text x="600" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#10b981">78</text>
  <text x="635" y="255" font-size="11" font-weight="normal" fill="#10b981" opacity="0.7">(AL)</text>
</svg>
