<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">EAX 子寄存器结构</text>

  <g transform="translate(0, 55)">

    <rect x="40" y="0" width="640" height="50" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="200" y="31" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="bold">高 16 位</text>

    <rect x="360" y="0" width="320" height="50" rx="6" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="520" y="31" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold">AX（16 位）</text>

    <path d="M360 57 L360 67 L680 67 L680 57" fill="none" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2,2"/>

    <rect x="360" y="80" width="160" height="44" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="440" y="107" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">AH（8 位）</text>

    <rect x="520" y="80" width="160" height="44" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="600" y="107" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">AL（8 位）</text>

    <line x1="360" y1="145" x2="680" y2="145" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

    <text x="40" y="167" font-size="13" font-weight="bold" fill="#94a3b8">示例：EAX = 0x12345678</text>

    <rect x="40" y="180" width="160" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="200" y="180" width="160" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="360" y="180" width="160" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="520" y="180" width="160" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>

    <text x="120" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">12</text>
    <text x="280" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">34</text>
    <text x="440" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">56</text>
    <text x="475" y="200" font-size="11" fill="#f59e0b">(AH)</text>
    <text x="600" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#10b981">78</text>
    <text x="635" y="200" font-size="11" fill="#10b981">(AL)</text>
  </g>
</svg>
