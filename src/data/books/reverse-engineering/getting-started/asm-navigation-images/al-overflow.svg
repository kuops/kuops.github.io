<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">8 位寄存器边界溢出与 CF 标志位逻辑</text>

  <g transform="translate(40, 68)">
    <rect x="0" y="-18" width="110" height="26" rx="4" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="55" y="0" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">add al, 1</text>
  </g>

  <g font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">
    <text x="310" y="80">EAX 高 24 位 (安全隔离区)</text>
    <text x="590" y="80">AL (低 8 位计算区)</text>
    <text x="770" y="80">CF (进位池)</text>
  </g>

  <g transform="translate(0, 95)">
    <text x="40" y="32" fill="#94a3b8" font-size="13" font-weight="bold">1. 执行前</text>
    <rect x="180" y="12" width="260" height="32" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="310" y="33" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">0x123456</text>
    <rect x="460" y="12" width="260" height="32" rx="4" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="590" y="33" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">0xFF (1111 1111)</text>
    <rect x="740" y="12" width="60" height="32" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="770" y="33" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">0</text>
  </g>

  <g transform="translate(0, 175)">
    <text x="40" y="55" fill="#fbbf24" font-size="13" font-weight="bold">2. 运算中</text>

    <line x1="450" y1="15" x2="450" y2="95" stroke="#ef4444" stroke-width="4"/>
    <rect x="380" y="43" width="60" height="22" rx="4" fill="#ef4444" fill-opacity="0.1"/>
    <text x="410" y="58" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">高位封闭</text>

    <text x="460" y="5" fill="#94a3b8" font-size="11" font-weight="bold">AL 8 位硬件容器边界</text>
    <rect x="460" y="15" width="260" height="80" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4,3"/>

    <g font-size="13" text-anchor="middle">
      <rect x="480" y="25" width="220" height="24" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>
      <text x="590" y="41" fill="#94a3b8">1 1 1 1   1 1 1 1  (AL)</text>

      <text x="495" y="65" fill="#60a5fa" font-weight="bold">+</text>
      <text x="685" y="65" fill="#60a5fa" font-weight="bold">1</text>
      <line x1="480" y1="72" x2="700" y2="72" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

      <circle cx="405" cy="80" r="11" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="405" y="84" fill="#60a5fa" font-size="12" font-weight="bold">1</text>

      <text x="595" y="88" fill="#ef4444" font-weight="bold">0 0 0 0   0 0 0 0</text>
    </g>

    <path d="M405 91 L405 120 L520 120" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <rect x="520" y="108" width="180" height="24" rx="4" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="610" y="124" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">第9位无处可去 → CF</text>
    <path d="M700 120 L770 120 L770 130" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="770,130 764,130 770,140 776,130" fill="#60a5fa"/>
  </g>

  <g transform="translate(0, 335)">
    <text x="40" y="32" fill="#60a5fa" font-size="13" font-weight="bold">3. 执行后</text>
    <rect x="180" y="12" width="260" height="32" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="310" y="33" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">0x123456</text>
    <rect x="460" y="12" width="260" height="32" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="590" y="33" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">0x00 (留存的 8 位零值)</text>
    <rect x="740" y="12" width="60" height="32" rx="4" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="770" y="33" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">1</text>
  </g>

  <g transform="translate(180, 430)">
    <rect x="0" y="0" width="620" height="36" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="15" y="22" fill="#60a5fa" font-size="12" font-weight="bold">EAX = 0x12345600 | 只有低 8 位清零，高 24 位完全没有接收到进位</text>
  </g>
</svg>
