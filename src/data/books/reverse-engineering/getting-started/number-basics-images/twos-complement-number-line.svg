<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <g font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="end">
    <text x="80" y="45">分类区段</text>
    <text x="80" y="105">十进制</text>
    <text x="80" y="165">十六进制</text>
  </g>
  <line x1="95" y1="20" x2="95" y2="210" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="110" y="25" width="320" height="30" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="270" y="44" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">&#8592; 负数 (128 个)</text>
  <circle cx="130" cy="130" r="4" fill="#3b82f6"/>
  <text x="130" y="105" text-anchor="middle" fill="#3b82f6" font-weight="bold">-128</text>
  <text x="130" y="165" text-anchor="middle" fill="#3b82f6" font-weight="bold">0x80</text>
  <text x="205" y="105" text-anchor="middle" fill="#94a3b8" font-size="16">...</text>
  <text x="205" y="165" text-anchor="middle" fill="#94a3b8" font-size="16">...</text>
  <circle cx="280" cy="130" r="3.5" fill="#3b82f6"/>
  <text x="280" y="105" text-anchor="middle" fill="#3b82f6">-3</text>
  <text x="280" y="165" text-anchor="middle" fill="#3b82f6">0xFD</text>
  <circle cx="340" cy="130" r="3.5" fill="#3b82f6"/>
  <text x="340" y="105" text-anchor="middle" fill="#3b82f6">-2</text>
  <text x="340" y="165" text-anchor="middle" fill="#3b82f6">0xFE</text>
  <circle cx="400" cy="130" r="3.5" fill="#60a5fa"/>
  <text x="400" y="105" text-anchor="middle" fill="#60a5fa">-1</text>
  <text x="400" y="165" text-anchor="middle" fill="#60a5fa">0xFF</text>
  <rect x="440" y="25" width="40" height="30" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="460" y="44" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">0</text>
  <circle cx="460" cy="130" r="5" fill="#94a3b8"/>
  <text x="460" y="105" text-anchor="middle" fill="#94a3b8" font-weight="bold">0</text>
  <text x="460" y="165" text-anchor="middle" fill="#94a3b8" font-weight="bold">0x00</text>
  <rect x="490" y="25" width="320" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <text x="650" y="44" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">正数 (127 个) &#8594;</text>
  <circle cx="520" cy="130" r="3.5" fill="#fbbf24"/>
  <text x="520" y="105" text-anchor="middle" fill="#fbbf24">+1</text>
  <text x="520" y="165" text-anchor="middle" fill="#fbbf24">0x01</text>
  <circle cx="580" cy="130" r="3.5" fill="#fbbf24"/>
  <text x="580" y="105" text-anchor="middle" fill="#fbbf24">+2</text>
  <text x="580" y="165" text-anchor="middle" fill="#fbbf24">0x02</text>
  <circle cx="640" cy="130" r="3.5" fill="#fbbf24"/>
  <text x="640" y="105" text-anchor="middle" fill="#fbbf24">+3</text>
  <text x="640" y="165" text-anchor="middle" fill="#fbbf24">0x03</text>
  <text x="715" y="105" text-anchor="middle" fill="#94a3b8" font-size="16">...</text>
  <text x="715" y="165" text-anchor="middle" fill="#94a3b8" font-size="16">...</text>
  <circle cx="790" cy="130" r="4" fill="#fbbf24"/>
  <text x="790" y="105" text-anchor="middle" fill="#fbbf24" font-weight="bold">+127</text>
  <text x="790" y="165" text-anchor="middle" fill="#fbbf24" font-weight="bold">0x7F</text>
  <path d="M110 130 L810 130" fill="none" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M400 135 Q430 148 460 135" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="430" y="152" text-anchor="middle" fill="#60a5fa" font-size="10" opacity="0.8">连续溢出</text>
  <text x="460" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">有符号 8 位整数(补码)：0x00~0x7F = 0~127，0x80~0xFF = -128~-1</text>
</svg>
