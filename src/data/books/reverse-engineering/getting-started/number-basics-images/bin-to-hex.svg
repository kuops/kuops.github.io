  <g transform="translate(0, 125)">
    <text x="25" y="35" font-size="14" font-weight="bold" fill="#94a3b8">十六进制</text>

    <rect x="180" y="10" width="175" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="267" y="36" font-family="monospace" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">1011 → 0xB</text>
    
