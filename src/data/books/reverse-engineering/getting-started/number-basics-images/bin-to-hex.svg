    <rect x="370" y="10" width="40" height="40" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/> 
    <text x="390" y="35" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">0</text>
    
    <rect x="415" y="10" width="40" height="40" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/> 
    <text x="435" y="35" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">1</text>
    
    <rect x="460" y="10" width="40" height="40" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/> 
