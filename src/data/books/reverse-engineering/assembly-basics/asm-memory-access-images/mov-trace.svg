<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="165" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="410" y="35">EBX</text>
    <text x="560" y="35">内存 [0x012FF30C]</text>
    <text x="700" y="35">ZF</text>
    <text x="740" y="35">SF</text>
    <text x="780" y="35">CF</text>
    <text x="850" y="35">EIP</text>
  </g>
  <line x1="30" y1="45" x2="900" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">00000000</text>
    <text x="390" y="72">0000000A</text>
    <text x="500" y="72">00000014</text>
    <text x="696" y="72" text-anchor="middle">0</text>
    <text x="736" y="72" text-anchor="middle">0</text>
    <text x="776" y="72" text-anchor="middle">0</text>
    <text x="826" y="72">00401000</text>
  </g>
  <line x1="30" y1="85" x2="900" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="117" fill="#38bdf8" font-weight="600">mov eax, 5</text>
    <rect x="282" y="102" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#34d399" stroke-width="1.2"/>
    <text x="290" y="117" fill="#34d399" font-weight="600">00000005</text>
    <text x="390" y="117" fill="#94a3b8" fill-opacity="0.5">0000000A</text>
    <text x="500" y="117" fill="#94a3b8" fill-opacity="0.5">00000014</text>
    <text x="696" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="736" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="776" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="818" y="102" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="826" y="117" fill="#60a5fa">00401005</text>
  </g>
  <line x1="30" y1="130" x2="900" y2="130" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="162" fill="#38bdf8" font-weight="600">mov eax, ebx</text>
    <rect x="282" y="147" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#34d399" stroke-width="1.2"/>
    <text x="290" y="162" fill="#34d399" font-weight="600">0000000A</text>
    <text x="390" y="162" fill="#94a3b8" fill-opacity="0.5">0000000A</text>
    <text x="500" y="162" fill="#94a3b8" fill-opacity="0.5">00000014</text>
    <text x="696" y="162" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="736" y="162" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="776" y="162" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="818" y="147" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="826" y="162" fill="#60a5fa">00401007</text>
  </g>
  <line x1="30" y1="175" x2="900" y2="175" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="207" fill="#38bdf8" font-weight="600">mov eax, dword ptr [ebp-4]</text>
    <rect x="282" y="192" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#34d399" stroke-width="1.2"/>
    <text x="290" y="207" fill="#34d399" font-weight="600">00000014</text>
    <text x="390" y="207" fill="#94a3b8" fill-opacity="0.5">0000000A</text>
    <text x="500" y="207" fill="#94a3b8" fill-opacity="0.5">00000014</text>
    <text x="696" y="207" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="736" y="207" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="776" y="207" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="818" y="192" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="826" y="207" fill="#60a5fa">0040100A</text>
  </g>
  <line x1="30" y1="220" x2="900" y2="220" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="252" fill="#38bdf8" font-weight="600">mov dword ptr [ebp-8], eax</text>
    <text x="290" y="252" fill="#94a3b8" fill-opacity="0.5">00000014</text>
    <text x="390" y="252" fill="#94a3b8" fill-opacity="0.5">0000000A</text>
    <text x="500" y="252" fill="#94a3b8" fill-opacity="0.5">00000014</text>
    <text x="696" y="252" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="736" y="252" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="776" y="252" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="818" y="237" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="826" y="252" fill="#60a5fa">0040100D</text>
  </g>
  <line x1="30" y1="265" x2="900" y2="265" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(30, 285)">
    <rect width="880" height="60" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
    <rect width="4" height="60" rx="2" fill="#fbbf24"/>
    <text x="20" y="22" fill="#fbbf24" font-weight="600" font-size="12">mov 不改变标志位</text>
    <text x="20" y="42" fill="#94a3b8" font-size="12">ZF/SF/CF 全程不变，EIP 每条指令后自动前进。最后一条写入 [ebp-8] = 0x012FF308，值为 00000014。</text>
  </g>
</svg>
