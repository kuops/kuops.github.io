<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">add 函数栈帧布局</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" font-weight="bold">进入函数体后(mov ebp, esp 之后)，低地址在上</text>
  <rect x="20" y="80" width="160" height="38" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ebp-4</text>
  <text x="190" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000008</text>
  <text x="320" y="104" font-size="13" font-weight="bold" fill="#94a3b8">局部变量 result</text>
  <text x="580" y="104" font-size="12" font-weight="bold" fill="#94a3b8">← 低地址(栈顶)</text>
  <rect x="20" y="120" width="160" height="38" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="30" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ebp</text>
  <text x="190" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">???</text>
  <text x="320" y="144" font-size="13" font-weight="bold" fill="#94a3b8">旧 EBP(push ebp 压入)</text>
  <rect x="20" y="160" width="160" height="38" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="184" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ebp+4</text>
  <text x="190" y="184" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00501E2F</text>
  <text x="320" y="184" font-size="13" font-weight="bold" fill="#94a3b8">返回地址(call 自动压入)</text>
  <rect x="20" y="200" width="160" height="38" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="224" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ebp+8</text>
  <text x="190" y="224" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">00000003</text>
  <text x="320" y="224" font-size="13" font-weight="bold" fill="#94a3b8">参数 a(第一个参数)</text>
  <rect x="20" y="240" width="160" height="38" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="264" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ebp+0Ch</text>
  <text x="190" y="264" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">00000005</text>
  <text x="320" y="264" font-size="13" font-weight="bold" fill="#94a3b8">参数 b(第二个参数)</text>
  <text x="580" y="264" font-size="12" font-weight="bold" fill="#94a3b8">← 高地址(栈底)</text>
</svg>