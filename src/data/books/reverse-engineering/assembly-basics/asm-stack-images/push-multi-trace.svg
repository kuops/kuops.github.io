<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 195" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">连续 push 多个值</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" font-weight="bold">初始：ESP=0x012FF310，EAX=0x00000005，EBX=0x0000000A</text>
  <g transform="translate(20, 80)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="150" y="0" font-size="13" fill="#94a3b8" font-weight="bold">ESP</text>
    <text x="300" y="0" font-size="13" fill="#94a3b8" font-weight="bold">栈顶[ESP]</text>
    <text x="480" y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="600" y="0" font-size="13" fill="#94a3b8" font-weight="bold">EBX</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>
  <g transform="translate(20, 110)">
    <text x="0" y="0"  font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="150" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF310</text>
    <text x="300" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="480" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">00000005</text>
    <text x="600" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">0000000A</text>
  </g>
  <g transform="translate(20, 140)">
    <text x="0" y="0"  font-size="14" font-weight="bold" fill="#10b981">push eax</text>
    <text x="150" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">012FF30C</text>
    <text x="300" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000005</text>
    <text x="480" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">00000005</text>
    <text x="600" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">0000000A</text>
  </g>
  <g transform="translate(20, 170)">
    <text x="0" y="0"  font-size="14" font-weight="bold" fill="#10b981">push ebx</text>
    <text x="150" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">012FF308</text>
    <text x="300" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">0000000A</text>
    <text x="480" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">00000005</text>
    <text x="600" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">0000000A</text>
  </g>
</svg>