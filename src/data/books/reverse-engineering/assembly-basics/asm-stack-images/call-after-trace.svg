    <text x="150" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00401100</text>
    <text x="300" y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401025</text>
    <text x="500" y="0"  font-size="14" font-weight="bold" fill="#94a3b8">返回地址压栈，EIP 跳到函数入口</text>
