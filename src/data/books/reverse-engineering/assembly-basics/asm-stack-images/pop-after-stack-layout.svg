<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 235" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">pop 后的栈内存布局</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" font-weight="bold">ESP 上移到 0x012FF30C，旧栈顶数据仍在内存中(未被清除)</text>
  <rect x="20" y="80" width="200" height="38" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="30" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF308</text>
  <text x="130" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">0000000A</text>
  <text x="240" y="104" font-size="12" font-weight="bold" fill="#94a3b8">已被读走，内存未清除</text>
  <rect x="20" y="120" width="200" height="38" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF30C</text>
  <text x="130" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00000005</text>
  <text x="240" y="144" font-size="12" font-weight="bold" fill="#fbbf24">← ESP 指向这里(新栈顶)</text>
  <rect x="20" y="160" width="200" height="38" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="30" y="184" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF310</text>
  <text x="130" y="184" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">(旧数据)</text>
  <text x="20" y="75" font-size="11" fill="#94a3b8" font-weight="bold">↓ 低地址(栈顶)</text>
  <text x="20" y="215" font-size="11" fill="#94a3b8" font-weight="bold">↓ 高地址(栈底)</text>
</svg>
