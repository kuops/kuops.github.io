<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">IEEE 754 浮点计算公式</text>

  <!-- Three component boxes -->
  <g transform="translate(20, 60)">
    <!-- Sign box -->
    <rect x="0" y="0" width="240" height="88" rx="4" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="120" y="24" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#3b82f6">(-1)^S</text>
    <text x="120" y="44" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">符号位 (1 位)</text>
    <text x="120" y="62" font-size="11" text-anchor="middle" fill="#94a3b8">S = 0 正, S = 1 负</text>
    <text x="120" y="80" font-size="10" text-anchor="middle" fill="#64748b">控制正负号</text>

    <!-- Multiply sign -->
    <text x="256" y="48" font-family="monospace" font-size="18" font-weight="bold" fill="#94a3b8">×</text>

    <!-- Mantissa box -->
    <rect x="280" y="0" width="240" height="88" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="400" y="24" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#10b981">1.M</text>
    <text x="400" y="44" font-size="11" font-weight="bold" text-anchor="middle" fill="#10b981">尾数 (23 位)</text>
    <text x="400" y="62" font-size="11" text-anchor="middle" fill="#94a3b8">隐含前导 1. 小数部分</text>
    <text x="400" y="80" font-size="10" text-anchor="middle" fill="#64748b">决定精度</text>

    <!-- Multiply sign -->
    <text x="536" y="48" font-family="monospace" font-size="18" font-weight="bold" fill="#94a3b8">×</text>

    <!-- Exponent box -->
    <rect x="560" y="0" width="240" height="88" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="680" y="24" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#fbbf24">2^(E - 127)</text>
    <text x="680" y="44" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">指数位 (8 位)</text>
    <text x="680" y="62" font-size="11" text-anchor="middle" fill="#94a3b8">E - 127 = 实际幂次</text>
    <text x="680" y="80" font-size="10" text-anchor="middle" fill="#64748b">决定范围/大小</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="175" x2="820" y2="175" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Example: 1.0 -->
  <g transform="translate(20, 195)">
    <text x="0" y="14" font-size="12" font-weight="bold" fill="#94a3b8">例：1.0</text>
    <text x="70" y="14" font-size="12" fill="#94a3b8">=</text>
    <text x="86" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">(-1)^0</text>
    <text x="146" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="162" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">1.00000000000000000000000</text>
    <text x="424" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="440" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">2^(127-127)</text>
    <text x="576" y="14" font-size="12" fill="#94a3b8">=</text>
    <text x="592" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">1.0</text>
  </g>

  <!-- Example: 8.5 -->
  <g transform="translate(20, 225)">
    <text x="0" y="14" font-size="12" font-weight="bold" fill="#94a3b8">例：8.5</text>
    <text x="70" y="14" font-size="12" fill="#94a3b8">=</text>
    <text x="86" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">(-1)^0</text>
    <text x="146" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="162" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">1.00010000000000000000000</text>
    <text x="424" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="440" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">2^(130-127)</text>
    <text x="576" y="14" font-size="12" fill="#94a3b8">=</text>
    <text x="592" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">8.5</text>
  </g>

  <!-- Example: 0.1 (the tricky one) -->
  <g transform="translate(20, 255)">
    <text x="0" y="14" font-size="12" font-weight="bold" fill="#94a3b8">例：0.1</text>
    <text x="70" y="14" font-size="12" fill="#94a3b8">=</text>
    <text x="86" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">(-1)^0</text>
    <text x="146" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="162" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">1.10011001100110011001101</text>
    <text x="424" y="14" font-size="12" fill="#94a3b8">×</text>
    <text x="440" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">2^(123-127)</text>
    <text x="576" y="14" font-size="12" fill="#94a3b8">≈</text>
    <text x="592" y="14" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">0.1</text>
  </g>

  <!-- 1.M explanation -->
  <g transform="translate(20, 295)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>
    <text x="0" y="22" font-size="12" font-weight="bold" fill="#94a3b8">1.M 不是乘法</text>
    <text x="0" y="42" font-size="12" fill="#94a3b8">是二进制小数点写法：</text>
    <text x="0" y="62" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">1.00010000000000000000000</text>
    <text x="0" y="82" font-size="12" fill="#94a3b8">↑ 隐含前导 1           ↑ 23 位尾数（小数部分）</text>
  </g>

</svg>