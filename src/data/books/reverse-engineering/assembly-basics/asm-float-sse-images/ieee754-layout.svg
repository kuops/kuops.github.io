<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">IEEE 754 单精度浮点编码（以 1.0 为例）</text>

  <!-- 32-bit segment layout -->
  <g transform="translate(20, 55)">
    <!-- Sign bit (1 bit) -->
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="27" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#3b82f6">0</text>
    <text x="20" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">符号位</text>
    <text x="20" y="74" font-size="10" text-anchor="middle" fill="#94a3b8">1 位</text>

    <!-- Exponent (8 bits) -->
    <rect x="44" y="0" width="200" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="144" y="27" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0111 1111</text>
    <text x="144" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#10b981">指数</text>
    <text x="144" y="74" font-size="10" text-anchor="middle" fill="#94a3b8">8 位, 值 = 127</text>

    <!-- Mantissa (23 bits) -->
    <rect x="248" y="0" width="552" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="524" y="27" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#fbbf24">0000 0000 0000 0000 0000 0000</text>
    <text x="524" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">尾数</text>
    <text x="524" y="74" font-size="10" text-anchor="middle" fill="#94a3b8">23 位, 值 = 0</text>
  </g>

  <!-- Hex and memory representation -->
  <g transform="translate(20, 155)">
    <text x="0" y="14" font-size="12" font-weight="bold" fill="#94a3b8">hex 编码：</text>
    <text x="100" y="14" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">3F 80 00 00</text>
    <text x="260" y="14" font-size="12" font-weight="bold" fill="#94a3b8">即 0x3F800000</text>

    <text x="0" y="44" font-size="12" font-weight="bold" fill="#94a3b8">内存（小端序）：</text>

    <rect x="140" y="28" width="60" height="28" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="170" y="47" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">00</text>
    <text x="170" y="70" font-family="monospace" font-size="10" text-anchor="middle" fill="#94a3b8">低地址</text>

    <rect x="204" y="28" width="60" height="28" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="234" y="47" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">00</text>

    <rect x="268" y="28" width="60" height="28" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="298" y="47" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">80</text>

    <rect x="332" y="28" width="60" height="28" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="362" y="47" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">3F</text>
    <text x="362" y="70" font-family="monospace" font-size="10" text-anchor="middle" fill="#94a3b8">高地址</text>
  </g>

</svg>
