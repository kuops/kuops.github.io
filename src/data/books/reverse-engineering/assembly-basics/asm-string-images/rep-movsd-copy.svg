<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">rep movsd 复制 8 字节 (2 次，每次 4 字节)</text>
  <text x="20" y="50" font-size="12" font-weight="bold" fill="#94a3b8">初始：ESI=0040A000，EDI=0040B000，ECX=2</text>

  <!-- 表头 -->
  <g transform="translate(20, 75)">
    <text x="0"   y="0" font-size="12" font-weight="bold" fill="#94a3b8">步骤</text>
    <text x="55"  y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">ESI</text>
    <text x="165" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">EDI</text>
    <text x="275" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">ECX</text>
    <text x="375" y="0" font-size="12" font-weight="bold" fill="#94a3b8">复制 [ESI]</text>
    <text x="475" y="0" font-size="12" font-weight="bold" fill="#94a3b8">[EDI] 目标内存 (8 字节)</text>
    <rect x="0" y="8" width="780" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <!-- 目标内存 8 个字节列位置：475, 509, 543, 577 | 611, 645, 679, 713 -->

  <!-- 步骤 1：复制 01 02 03 04 -->
  <g transform="translate(20, 105)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">1</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A004</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B004</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000001</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">01 02 03 04</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">01</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">02</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">03</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">04</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="645" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="679" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="713" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
  </g>

  <!-- 步骤 2：复制 05 06 07 08 -->
  <g transform="translate(20, 130)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">2</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A008</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B008</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000000</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">05 06 07 08</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">01</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">02</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">03</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">04</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">05</text>
    <text x="645" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">06</text>
    <text x="679" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">07</text>
    <text x="713" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">08</text>
  </g>

  <!-- 结果说明：translate(20, 160)，rect y=0 h=50，最低=160+50=210，viewBox=230 -->
  <g transform="translate(20, 160)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#10b981">ECX 从 2 减到 0，8 字节全部复制完成</text>
    <text x="16" y="40" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">目标 0040B000：01 02 03 04 05 06 07 08</text>
  </g>
</svg>
