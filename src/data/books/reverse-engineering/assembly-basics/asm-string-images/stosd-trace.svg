<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 255" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">rep stosd 填充 3 个 dword</text>
  <text x="20" y="50" font-size="12" font-weight="bold" fill="#94a3b8">初始：EAX=DEADBEEF，EDI=0040C000，ECX=3</text>

  <!-- 表头 -->
  <g transform="translate(20, 75)">
    <text x="0"   y="0" font-size="12" font-weight="bold" fill="#94a3b8">步骤</text>
    <text x="55"  y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">EDI</text>
    <text x="165" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">ECX</text>
    <text x="275" y="0" font-size="12" font-weight="bold" fill="#94a3b8">写入 EAX</text>
    <text x="435" y="0" font-size="12" font-weight="bold" fill="#94a3b8">[EDI] 目标内存 (3 个 dword)</text>
    <rect x="0" y="8" width="780" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <!-- dword 列位置：435, 515, 595 -->

  <!-- 步骤 1：写入第 1 个 DEADBEEF -->
  <g transform="translate(20, 105)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">1</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040C004</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000002</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
    <text x="435" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
    <text x="515" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">????????</text>
    <text x="595" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">????????</text>
  </g>

  <!-- 步骤 2：写入第 2 个 DEADBEEF -->
  <g transform="translate(20, 130)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">2</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040C008</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000001</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
    <text x="435" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">DEADBEEF</text>
    <text x="515" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
    <text x="595" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">????????</text>
  </g>

  <!-- 步骤 3：写入第 3 个 DEADBEEF -->
  <g transform="translate(20, 155)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">3</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040C00C</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000000</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
    <text x="435" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">DEADBEEF</text>
    <text x="515" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">DEADBEEF</text>
    <text x="595" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">DEADBEEF</text>
  </g>

  <!-- 结果说明：translate(20, 185)，rect h=50，最低=185+50=235，viewBox=255 -->
  <g transform="translate(20, 185)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#10b981">ECX 从 3 减到 0，3 个 dword 全部填充为 DEADBEEF</text>
    <text x="16" y="40" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">目标 0040C000：DEADBEEF DEADBEEF DEADBEEF (12 字节)</text>
  </g>
</svg>
