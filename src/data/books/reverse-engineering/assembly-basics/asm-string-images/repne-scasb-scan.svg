<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">repne scasb 扫描 "Hi\0" 寻找 \0（strlen）</text>

  <!-- 寄存器初始值 -->
  <g transform="translate(20, 50)">
    <text x="0" y="14" font-size="12" font-weight="bold" fill="#94a3b8">初始状态：</text>
    <text x="100" y="14" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">AL = 00 (要找 \0)</text>
    <text x="280" y="14" font-family="monospace" font-size="12" font-weight="bold" fill="#3b82f6">EDI = 0040D000</text>
    <text x="460" y="14" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24">ECX = FFFFFFFF</text>
  </g>

  <!-- 内存块标题 -->
  <text x="20" y="95" font-size="12" font-weight="bold" fill="#94a3b8">内存 0040D000：</text>

  <!-- ===== 初始内存布局 ===== -->
  <g transform="translate(20, 105)">
    <!-- 3 个字节格子 -->
    <rect x="0" y="0" width="80" height="36" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="40" y="24" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">48 'H'</text>
    <text x="40" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#94a3b8">0040D000</text>

    <rect x="84" y="0" width="80" height="36" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="124" y="24" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">69 'i'</text>
    <text x="124" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#94a3b8">0040D001</text>

    <rect x="168" y="0" width="80" height="36" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="208" y="24" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">00 \0</text>
    <text x="208" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#94a3b8">0040D002</text>
  </g>

  <!-- ===== 步骤 1 ===== -->
  <g transform="translate(20, 180)">
    <text x="0" y="14" font-size="11" font-weight="bold" fill="#fbbf24">步骤 1</text>

    <!-- AL 比较框 -->
    <rect x="60" y="0" width="60" height="28" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="90" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">AL=00</text>

    <text x="130" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">!=</text>

    <rect x="160" y="0" width="60" height="28" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="190" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#fbbf24">[EDI]=48</text>

    <text x="240" y="19" font-size="12" font-weight="bold" fill="#94a3b8">00 != 48，不等，继续</text>

    <text x="500" y="19" font-family="monospace" font-size="11" fill="#fbbf24">ECX: FFFFFFFF -> FFFFFFFE</text>
    <text x="500" y="35" font-family="monospace" font-size="11" fill="#3b82f6">EDI -> 0040D001</text>
  </g>

  <!-- ===== 步骤 2 ===== -->
  <g transform="translate(20, 230)">
    <text x="0" y="14" font-size="11" font-weight="bold" fill="#fbbf24">步骤 2</text>

    <rect x="60" y="0" width="60" height="28" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="90" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">AL=00</text>

    <text x="130" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">!=</text>

    <rect x="160" y="0" width="60" height="28" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="190" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#fbbf24">[EDI]=69</text>

    <text x="240" y="19" font-size="12" font-weight="bold" fill="#94a3b8">00 != 69，不等，继续</text>

    <text x="500" y="19" font-family="monospace" font-size="11" fill="#fbbf24">ECX: FFFFFFFE -> FFFFFFFD</text>
    <text x="500" y="35" font-family="monospace" font-size="11" fill="#3b82f6">EDI -> 0040D002</text>
  </g>

  <!-- ===== 步骤 3 ===== -->
  <g transform="translate(20, 280)">
    <text x="0" y="14" font-size="11" font-weight="bold" fill="#10b981">步骤 3</text>

    <rect x="60" y="0" width="60" height="28" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="90" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">AL=00</text>

    <text x="130" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">==</text>

    <rect x="160" y="0" width="60" height="28" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="190" y="19" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">[EDI]=00</text>

    <text x="240" y="19" font-size="12" font-weight="bold" fill="#10b981">00 == 00，相等！ZF=1，停止</text>

    <text x="500" y="19" font-family="monospace" font-size="11" fill="#fbbf24">ECX: FFFFFFFD -> FFFFFFFC</text>
    <text x="500" y="35" font-family="monospace" font-size="11" fill="#3b82f6">EDI -> 0040D003</text>
  </g>

  <!-- ===== 结果 ===== -->
  <g transform="translate(20, 340)">
    <rect x="0" y="0" width="640" height="68" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12" font-weight="bold" fill="#10b981">字符串长度 = 初始 ECX - 当前 ECX - 1</text>
    <text x="16" y="42" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">FFFFFFFF - FFFFFFFC = 3 (扫描了 3 次)</text>
    <text x="16" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">3 - 1 = 2 (\0 不算长度)</text>
  </g>
</svg>
