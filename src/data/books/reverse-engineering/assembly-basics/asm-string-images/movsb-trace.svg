<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">rep movsb 逐字节复制 "Hello"</text>
  <text x="20" y="50" font-size="12" font-weight="bold" fill="#94a3b8">初始：ESI=0040A000，EDI=0040B000，ECX=5</text>

  <!-- 表头 -->
  <g transform="translate(20, 75)">
    <text x="0"   y="0" font-size="12" font-weight="bold" fill="#94a3b8">步骤</text>
    <text x="55"  y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">ESI</text>
    <text x="165" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">EDI</text>
    <text x="275" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">ECX</text>
    <text x="375" y="0" font-size="12" font-weight="bold" fill="#94a3b8">复制</text>
    <text x="475" y="0" font-size="12" font-weight="bold" fill="#94a3b8">[EDI] 目标内存 (5 字节)</text>
    <rect x="0" y="8" width="780" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <!-- 目标内存 5 个字节列位置：475, 509, 543, 577, 611，每个间隔 34px -->

  <!-- 步骤 1：写入 48 'H' -->
  <g transform="translate(20, 105)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">1</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A001</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B001</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000004</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">48 ('H')</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">48</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
  </g>

  <!-- 步骤 2：写入 65 'e' -->
  <g transform="translate(20, 130)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">2</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A002</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B002</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000003</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">65 ('e')</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">48</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">65</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
  </g>

  <!-- 步骤 3：写入 6C 'l' -->
  <g transform="translate(20, 155)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">3</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A003</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B003</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000002</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6C ('l')</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">48</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">65</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6C</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
  </g>

  <!-- 步骤 4：写入 6C 'l' -->
  <g transform="translate(20, 180)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">4</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A004</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B004</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000001</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6C ('l')</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">48</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">65</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">6C</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6C</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">??</text>
  </g>

  <!-- 步骤 5：写入 6F 'o' -->
  <g transform="translate(20, 205)">
    <text x="0"   y="0" font-size="13" font-weight="bold" fill="#94a3b8">5</text>
    <text x="55"  y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">0040A005</text>
    <text x="165" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">0040B005</text>
    <text x="275" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">00000000</text>
    <text x="375" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6F ('o')</text>
    <text x="475" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">48</text>
    <text x="509" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">65</text>
    <text x="543" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">6C</text>
    <text x="577" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">6C</text>
    <text x="611" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">6F</text>
  </g>

  <!-- 结果说明 -->
  <g transform="translate(20, 235)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#10b981">ECX 从 5 减到 0，5 个字节全部复制完成</text>
    <text x="16" y="40" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">目标 0040B000：48 65 6C 6C 6F = "Hello"</text>
  </g>
</svg>
