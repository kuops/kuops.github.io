<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <!-- 主标题 & 初始条件 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">lea 指令执行过程详解</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8">初始状态：ECX = 0x0040A000，EDX = 3</text>

  <!-- 第一区块：指令 + 执行结果 横向并排 -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="440" height="40" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="15" y="26" font-family="monospace" font-size="14" fill="#94a3b8">执行指令：</text>
    <text x="100" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">lea eax, dword ptr [ecx+edx*4]</text>

    <rect x="460" y="0" width="340" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="475" y="26" font-size="14" fill="#94a3b8">运行结果：</text>
    <text x="560" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">EAX = 0x0040A00C</text>
  </g>

  <!-- 分割线 -->
  <line x1="20" y1="140" x2="940" y2="140" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- 第二区块：分步计算 独立单行布局，无叠加 -->
  <g transform="translate(20, 160)">
    <!-- 标题说明 -->
    <text x="0" y="20" font-size="13" font-weight="bold" fill="#94a3b8">分步计算：ecx + edx × 4</text>

    <!-- 第一行：ECX 数值 -->
    <rect x="0" y="35" width="220" height="38" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="15" y="60" font-size="14" fill="#94a3b8">ECX = </text>
    <text x="70" y="60" font-family="monospace" font-weight="bold" fill="#3b82f6">0x0040A000</text>

    <!-- 加号 -->
    <text x="245" y="60" font-size="18" fill="#94a3b8">+</text>

    <!-- 第二行：EDX*4 数值 -->
    <rect x="270" y="35" width="240" height="38" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="285" y="60" font-size="14" fill="#94a3b8">EDX × 4 = </text>
    <text x="360" y="60" font-family="monospace" font-weight="bold" fill="#fbbf24">3 × 4 = 0x0C</text>

    <!-- 等号 -->
    <text x="530" y="60" font-size="18" fill="#94a3b8">=</text>

    <!-- 第三行：最终求和结果 -->
    <rect x="555" y="35" width="260" height="38" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="570" y="60" font-size="14" fill="#94a3b8">合计 = </text>
    <text x="630" y="60" font-family="monospace" font-weight="bold" fill="#10b981">0x0040A00C</text>
  </g>

  <!-- 底部说明文字 -->
  <text x="20" y="285" font-size="12" fill="#94a3b8">补充：lea 仅计算有效地址，不访问内存，ZF、SF、CF 等所有标志位保持不变</text>
</svg>