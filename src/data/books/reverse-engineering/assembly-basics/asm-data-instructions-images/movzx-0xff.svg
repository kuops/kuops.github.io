<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="15" font-weight="bold" fill="#94a3b8">MOVZX 零扩展 — 无条件填 0</text>
  <text x="20" y="60" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始 AL = 0xFF，执行 <tspan fill="#ef4444">movzx</tspan> eax, al </text>

  <g transform="translate(20, 50)">
    <text x="10" y="65" font-size="12" fill="#94a3b8" opacity="0.8">输入源 (8位 AL):</text>
    <g transform="translate(130, 48)">
      <rect x="0" y="0" width="35" height="26" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="17.5" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#10b981">1</text>
      <text x="17.5" y="-5" font-size="11" fill="#94a3b8" opacity="0.6" text-anchor="middle">B7(符号位)</text>
      
      <rect x="35" y="0" width="105" height="26" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="87.5" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#94a3b8" opacity="0.8">111 1111</text>
      <text x="87.5" y="-5" font-size="11" fill="#94a3b8" opacity="0.6" text-anchor="middle">低 7 位</text>
      <text x="150" y="18" font-family="monospace" font-size="12" fill="#94a3b8" opacity="0.6">= 0xFF</text>
    </g>

    <g stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" fill="none">
      <path d="M 147.5 74 L 147.5 105 L 235 105" stroke-dasharray="2,2"/>
      <path d="M 147.5 105 L 335 105 L 335 125" stroke-dasharray="2,2"/>
      <path d="M 235 74 L 235 90 L 635 90 L 635 125" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="2,2"/>
    </g>

    <text x="10" y="142" font-size="12" fill="#94a3b8" opacity="0.8">执行后 (32位 EAX):</text>
    <g transform="translate(130, 125)">
      <rect x="0" y="0" width="140" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="70" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#3b82f6">00000000</text>
      
      <rect x="140" y="0" width="140" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="210" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#3b82f6">00000000</text>
      
      <rect x="280" y="0" width="140" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="350" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#3b82f6">00000000</text>
      <text x="210" y="40" font-size="11" fill="#3b82f6" opacity="0.8" text-anchor="middle">高 24 位无条件填 0 (➔ 0x000000)</text>

      <rect x="420" y="0" width="140" height="26" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="490" y="18" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#94a3b8" opacity="0.8">11111111</text>
      <text x="490" y="40" font-size="11" fill="#94a3b8" opacity="0.6" text-anchor="middle">低 8 位承袭原值 (0xFF)</text>

      <text x="575" y="18" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">= 0x000000FF</text>
    </g>
  </g>
</svg>