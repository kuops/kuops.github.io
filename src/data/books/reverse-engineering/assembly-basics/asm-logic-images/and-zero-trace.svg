<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="zfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="105" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="400" y="35">ZF</text>
    <text x="440" y="35">SF</text>
    <text x="480" y="35">CF</text>
    <text x="560" y="35">EIP</text>
    <text x="750" y="35">说明</text>
  </g>
  <line x1="30" y1="45" x2="890" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">00000000</text>
    <text x="396" y="72" text-anchor="middle">0</text>
    <text x="436" y="72" text-anchor="middle">0</text>
    <text x="476" y="72" text-anchor="middle">0</text>
    <text x="530" y="72">00401000</text>
    <text x="630" y="72" font-size="12">EAX 初始即为全零</text>
  </g>
  <line x1="30" y1="85" x2="890" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="117" fill="#38bdf8" font-weight="600">and eax, FF</text>
    <rect x="282" y="102" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="117" fill="#34d399" font-weight="600">00000000</text>
    <rect x="388" y="102" width="24" height="20" rx="4" fill="url(#zfGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="396" y="117" fill="#fbbf24" font-weight="700">1</text>
    <text x="436" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="102" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="117" fill="#60a5fa">00401003</text>
    <text x="630" y="117" fill="#fbbf24" font-size="12">结果为 0 触发 ZF=1</text>
  </g>
  <line x1="30" y1="130" x2="890" y2="130" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(40, 150)">
    <rect width="840" height="280" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

    <text x="20" y="28" fill="#64748b" font-size="11" font-weight="500">逻辑运算：0 与任何数相 AND 结果必为 0</text>

    <line x1="510" y1="50" x2="510" y2="200" stroke="#94a3b8" stroke-opacity="0.2" stroke-dasharray="2,2" stroke-width="1"/>

    <g transform="translate(20, 55)">
      <text x="0" y="20" fill="#64748b" font-size="11">原 EAX (0x00000000)</text>
      <text x="160" y="20" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="20" fill="#94a3b8" letter-spacing="1">00000000</text>

      <text x="0" y="65" fill="#64748b" font-size="11">掩码 (0x000000FF)</text>
      <text x="145" y="65" fill="#fbbf24" font-size="14" font-weight="bold">&amp;</text>
      <text x="160" y="65" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="65" fill="#38bdf8" font-weight="600" letter-spacing="1">11111111</text>

      <line x1="160" y1="85" x2="770" y2="85" stroke="#334155" stroke-width="1.5"/>

      <text x="0" y="115" fill="#34d399" font-size="11">结果 (0x00000000)</text>
      <text x="145" y="115" fill="#34d399" font-size="14" font-weight="bold">=</text>
      <text x="160" y="115" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="115" fill="#34d399" font-weight="600" letter-spacing="1">00000000</text>
    </g>

    <text x="335" y="203" fill="#64748b" font-size="10" text-anchor="end">高 24 位清零区</text>
    <text x="525" y="203" fill="#fbbf24" font-size="10">低 8 位运算区</text>

    <rect x="15" y="215" width="810" height="50" rx="4" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="35" y="240" fill="#34d399" font-size="11">运算结果为全零，CPU 将 ZF 标志位置 1。这就是"零标志位"的来源。</text>
  </g>
</svg>
