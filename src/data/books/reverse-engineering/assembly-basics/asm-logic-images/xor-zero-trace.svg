<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 405" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="zfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="105" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="400" y="35">ZF</text>
    <text x="440" y="35">SF</text>
    <text x="480" y="35">CF</text>
    <text x="560" y="35">EIP</text>
    <text x="750" y="35">说明</text>
  </g>
  <line x1="30" y1="45" x2="890" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">DEADBEEF</text>
    <text x="396" y="72" text-anchor="middle">0</text>
    <text x="436" y="72" text-anchor="middle" fill="#f87171">1</text>
    <text x="476" y="72" text-anchor="middle">0</text>
    <text x="530" y="72">00401000</text>
    <text x="630" y="72" font-size="12">EAX 为负数状态</text>
  </g>
  <line x1="30" y1="85" x2="890" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="117" fill="#38bdf8" font-weight="600">xor eax, eax</text>
    <rect x="282" y="102" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="117" fill="#34d399" font-weight="600">00000000</text>
    <rect x="392" y="102" width="20" height="20" rx="4" fill="url(#zfGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="396" y="117" fill="#34d399" font-weight="700">1</text>
    <text x="436" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="102" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="117" fill="#60a5fa">00401002</text>
    <text x="630" y="117" fill="#34d399" font-size="12">自身异或清零，ZF=1，SF=0</text>
  </g>
  <line x1="30" y1="130" x2="890" y2="130" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(40, 150)">
    <rect width="840" height="225" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

    <text x="20" y="28" fill="#64748b" font-size="11" font-weight="500">XOR 特性：同一数值的对应位完全相同，"同则为 0"，结果必为全零</text>

    <line x1="510" y1="50" x2="510" y2="200" stroke="#94a3b8" stroke-opacity="0.2" stroke-dasharray="2,2" stroke-width="1"/>

    <g transform="translate(20, 55)">
      <text x="0" y="20" fill="#64748b" font-size="11">EAX (源: 0xDEADBEEF)</text>
      <text x="180" y="20" fill="#94a3b8" letter-spacing="1">11011110 10101101 10111110</text>
      <text x="510" y="20" fill="#94a3b8" letter-spacing="1">11101111</text>

      <text x="0" y="65" fill="#64748b" font-size="11">EAX (目的: 0xDEADBEEF)</text>
      <text x="167" y="65" fill="#fbbf24" font-size="14" font-weight="bold">^</text>
      <text x="180" y="65" fill="#94a3b8" letter-spacing="1">11011110 10101101 10111110</text>
      <text x="510" y="65" fill="#94a3b8" letter-spacing="1">11101111</text>

      <line x1="180" y1="85" x2="770" y2="85" stroke="#334155" stroke-width="1.5"/>

      <text x="0" y="115" fill="#34d399" font-size="11">结果 (0x00000000)</text>
      <text x="167" y="115" fill="#34d399" font-size="14" font-weight="bold">=</text>
      <text x="180" y="115" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="115" fill="#34d399" font-weight="600" letter-spacing="1">00000000</text>
    </g>

    <text x="335" y="203" fill="#64748b" font-size="10" text-anchor="end">高 24 位（DEADBE）对消区</text>
    <text x="525" y="203" fill="#34d399" font-size="10">低 8 位（EF）对消区</text>

  </g>
</svg>
