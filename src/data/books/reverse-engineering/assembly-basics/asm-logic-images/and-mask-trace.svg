<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">and 掩码运算追踪</text>
  <text font-weight="bold" x="20" y="52" font-size="12" fill="#94a3b8">初始：EAX=0x12345678，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="130"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="280"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="540"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="580"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="680"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">12345678</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">00401000</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">原始包含高低位数据</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">and eax, 0xFF</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">25 FF000000</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000078</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401005</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">高 24 位清零，只留 0x78</text>
  </g>

  <rect x="20" y="162" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- 二进制拆解 -->
  <g transform="translate(20, 205)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">二进制拆解</text>

    <g transform="translate(0, 25)" font-family="monospace" font-size="16">
      <text font-weight="bold" x="0"   y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#94a3b8">原 EAX</text>
      <text font-weight="bold" x="140" y="0"  fill="#94a3b8">00010010 00110100 01010110</text>
      <text x="400" y="0"  fill="#fbbf24" font-weight="bold">01111000</text>
      <text font-weight="bold" x="500" y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#94a3b8">(低 8 位是 0x78)</text>

      <text font-weight="bold" x="0"   y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#94a3b8">掩码 0xFF</text>
      <text x="90"  y="30" fill="#fbbf24" font-weight="bold">&amp;</text>
      <text font-weight="bold" x="140" y="30" fill="#94a3b8">00000000 00000000 00000000</text>
      <text x="400" y="30" fill="#3b82f6" font-weight="bold">11111111</text>
      <text font-weight="bold" x="500" y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#94a3b8">(低 8 位全 1)</text>

      <rect x="140" y="48" width="450" height="1" fill="#94a3b8" fill-opacity="0.3"/>

      <text font-weight="bold" x="0"   y="68" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#34d399">AND 结果</text>
      <text x="90"  y="68" fill="#34d399" font-weight="bold">=</text>
      <text font-weight="bold" x="140" y="68" fill="#94a3b8">00000000 00000000 00000000</text>
      <text x="400" y="68" fill="#34d399" font-weight="bold">01111000</text>
      <text x="500" y="68" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" fill="#94a3b8" font-weight="bold">→ ZF=0, CF=0, OF=0</text>

      <text font-weight="bold" x="140" y="95" fill="#94a3b8" font-size="11">↑ 高 24 位截断区</text>
      <text font-weight="bold" x="400" y="95" fill="#34d399" font-size="11">↑ 低 8 位保留区</text>
    </g>
  </g>

  <!-- 总结提示 -->
  <rect x="20" y="340" width="900" height="44" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text font-weight="bold" x="40" y="365" font-size="13" fill="#60a5fa">任何数 &amp; 0 = 0(清零)；任何数 &amp; 1 = 原值(保留)。掩码 0xFF 只保留最低字节。</text>
</svg>