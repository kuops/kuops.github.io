<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="105" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="400" y="35">ZF</text>
    <text x="440" y="35">SF</text>
    <text x="480" y="35">CF</text>
    <text x="560" y="35">EIP</text>
    <text x="750" y="35">说明</text>
  </g>
  <line x1="30" y1="45" x2="890" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">0000000F</text>
    <text x="396" y="72" text-anchor="middle">0</text>
    <text x="436" y="72" text-anchor="middle">0</text>
    <text x="476" y="72" text-anchor="middle">0</text>
    <text x="530" y="72">00401000</text>
    <text x="630" y="72" font-size="12">EAX 仅低 4 位为 1</text>
  </g>
  <line x1="30" y1="85" x2="890" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="117" fill="#38bdf8" font-weight="600">not eax</text>
    <rect x="282" y="102" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="117" fill="#34d399" font-weight="600">FFFFFFF0</text>
    <text x="396" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="117" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="102" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="117" fill="#60a5fa">00401001</text>
    <text x="630" y="117" fill="#34d399" font-size="12">每一位取反，标志位不变</text>
  </g>
  <line x1="30" y1="130" x2="890" y2="130" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(40, 150)">
    <rect width="840" height="220" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

    <text x="20" y="28" fill="#64748b" font-size="11" font-weight="500">NOT 运算：单目运算符，将 32 位的 0 和 1 状态全部对调</text>

    <g transform="translate(20, 55)">
      <text x="0" y="20" fill="#64748b" font-size="11">原 EAX (0x0000000F)</text>
      <text x="167" y="20" fill="#fbbf24" font-size="14" font-weight="bold">~</text>
      <text x="180" y="20" fill="#94a3b8" letter-spacing="1">00000000 00000000 00000000 00001111</text>

      <line x1="180" y1="45" x2="770" y2="45" stroke="#334155" stroke-width="1.5"/>

      <text x="0" y="80" fill="#34d399" font-size="11">结果 (0xFFFFFFF0)</text>
      <text x="167" y="80" fill="#34d399" font-size="14" font-weight="bold">=</text>
      <text x="180" y="80" fill="#34d399" letter-spacing="1">11111111 11111111 11111111 11110000</text>
    </g>

    <rect x="15" y="155" width="810" height="50" rx="4" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="35" y="180" fill="#34d399" font-size="11">NOT 不修改任何标志位。若取反后需判断 ZF，须紧跟 TEST 或 CMP 指令。</text>
  </g>
</svg>
