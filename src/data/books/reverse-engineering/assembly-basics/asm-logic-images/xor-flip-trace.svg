<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">xor 按位翻转追踪</text>
  <text x="20" y="52" font-size="12" font-weight="bold" fill="#94a3b8">初始：EAX=0x00000055，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="130"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="280"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="540"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="580"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="680"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">00000055</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">00401000</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">低 8 位为 01010101</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">xor eax, 0xFF</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">35 FF000000</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">000000AA</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#10b981">1</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401005</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">与 0xFF 异或实现按位取反</text>
  </g>

  <rect x="20" y="162" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- 二进制拆解 -->
  <g transform="translate(20, 205)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">二进制拆解</text>

    <g transform="translate(0, 25)" font-family="monospace" font-size="16">
      <text x="0"   y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">原 EAX</text>
      <text x="140" y="0"  font-weight="bold" fill="#94a3b8">00000000 00000000 00000000</text>
      <text x="400" y="0"  font-weight="bold" fill="#3b82f6">01010101</text>
      <text x="500" y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">(0x55)</text>

      <text x="0"   y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">掩码 0xFF</text>
      <text x="90"  y="30" font-weight="bold" fill="#fbbf24">^</text>
      <text x="140" y="30" font-weight="bold" fill="#94a3b8">00000000 00000000 00000000</text>
      <text x="400" y="30" font-weight="bold" fill="#10b981">11111111</text>
      <text x="500" y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">(低 8 位全 1)</text>

      <rect x="140" y="48" width="450" height="1" fill="#94a3b8" fill-opacity="0.3"/>

      <text x="0"   y="68" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#34d399">XOR 结果</text>
      <text x="90"  y="68" font-weight="bold" fill="#34d399">=</text>
      <text x="140" y="68" font-weight="bold" fill="#94a3b8">00000000 00000000 00000000</text>
      <text x="400" y="68" font-weight="bold" fill="#34d399">10101010</text>
      <text x="500" y="68" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">(0xAA, SF=1)</text>
    </g>
  </g>

  <!-- 总结提示 -->
  <rect x="20" y="340" width="900" height="44" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="40" y="365" font-size="13" font-weight="bold" fill="#60a5fa">XOR 0xFF 常用于代替 NOT 实现局部取反，且会更新标志位(NOT 不会)。</text>
</svg>