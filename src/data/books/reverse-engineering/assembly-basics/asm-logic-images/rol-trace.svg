<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">rol 循环左移追踪</text>
  <text x="20" y="52" font-size="12" font-weight="bold" fill="#94a3b8">初始：EAX=0x80000001，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="130"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="280"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="540"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="580"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="680"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">80000001</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#ef4444">1</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">00401000</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8"></text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">rol eax, 1</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">D1C0</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000003</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#60a5fa">1</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401002</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#34d399">最高位 1 绕回最低位，CF=1</text>
  </g>

  <rect x="20" y="165" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- 二进制拆解 -->
  <g transform="translate(20, 190)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">二进制拆解</text>

    <g transform="translate(0, 25)" font-family="monospace" font-size="16">
      <text x="140" y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">CF</text>

      <text x="0"   y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">初始</text>
      <text x="140" y="30" font-weight="bold" fill="#94a3b8">0</text>
      <text x="180" y="30" font-weight="bold" fill="#94a3b8"><tspan fill="#60a5fa">1</tspan>0000000 00000000 00000000 0000000<tspan fill="#60a5fa">1</tspan></text>

      <text x="0"   y="60" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#10b981">ROL 1</text>
      <text x="140" y="60" font-weight="bold" fill="#60a5fa">1</text>
      <text x="180" y="60" font-weight="bold" fill="#94a3b8">00000000 00000000 00000000 000000<tspan fill="#60a5fa">1</tspan><tspan fill="#ef4444">1</tspan></text>
      <text x="600" y="60" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#fbbf24">&lt;&lt; 循环左移 1 位</text>
    </g>
  </g>

  <!-- 总结提示 -->
  <rect x="20" y="310" width="900" height="44" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="40" y="335" font-size="13" font-weight="bold" fill="#60a5fa">ROL 循环左移：最高位移出，绕回到最低位，同时该位复制到 CF。</text>
</svg>