<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="105" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="400" y="35">ZF</text>
    <text x="440" y="35">SF</text>
    <text x="480" y="35">CF</text>
    <text x="560" y="35">EIP</text>
    <text x="750" y="35">说明</text>
  </g>
  <line x1="30" y1="45" x2="890" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">C0000003</text>
    <text x="396" y="72" text-anchor="middle">0</text>
    <text x="436" y="72" text-anchor="middle" fill="#f87171">1</text>
    <text x="476" y="72" text-anchor="middle">0</text>
    <text x="530" y="72">00401000</text>
    <text x="630" y="72" font-size="12">最高位为 1，负数</text>
  </g>
  <line x1="30" y1="85" x2="890" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="107" fill="#38bdf8" font-weight="600">shl eax, 1</text>
    <rect x="282" y="92" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="107" fill="#34d399" font-weight="600">80000006</text>
    <text x="396" y="107" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="107" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">1</text>
    <rect x="472" y="92" width="20" height="20" rx="4" fill="url(#cfGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="476" y="107" fill="#34d399" font-weight="700">1</text>
    <rect x="522" y="92" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="107" fill="#60a5fa">00401002</text>
    <text x="630" y="107" fill="#34d399" font-size="12">CF=1，OF=0（符号位未变）</text>
  </g>
  <line x1="30" y1="118" x2="890" y2="118" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>

  <g>
    <text x="40" y="140" fill="#38bdf8" font-weight="600">shl eax, 1</text>
    <rect x="282" y="125" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="140" fill="#34d399" font-weight="600">0000000C</text>
    <text x="396" y="140" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="140" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="472" y="125" width="20" height="20" rx="4" fill="url(#cfGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="476" y="140" fill="#34d399" font-weight="700">1</text>
    <rect x="522" y="125" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="140" fill="#60a5fa">00401004</text>
    <text x="630" y="140" fill="#fbbf24" font-size="12">CF=1，OF=1（符号位从 1 变 0）</text>
  </g>
  <line x1="30" y1="151" x2="890" y2="151" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(40, 165)">
    <rect width="840" height="265" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

    <text x="20" y="28" fill="#64748b" font-size="11" font-weight="500">32 位寄存器移位流向：最高位移出进 CF，低位补 0</text>

    <g transform="translate(20, 45)">
      <text x="80" y="0" fill="#64748b" font-size="10" text-anchor="middle">CF</text>
      <text x="80" y="15" fill="#94a3b8" fill-opacity="0.5" font-size="11">0</text>
      <text x="140" y="15" fill="#94a3b8" letter-spacing="1"><tspan fill="#f87171" font-weight="bold">1</tspan><tspan fill="#fbbf24" font-weight="bold">1</tspan>000000 00000000 00000000 00000011</text>
      <text x="680" y="15" fill="#64748b" font-size="11">[C0000003]</text>

      <text x="80" y="50" fill="#f87171" font-size="12" font-weight="bold">1</text>
      <text x="100" y="50" fill="#fbbf24" font-size="11">←</text>
      <text x="140" y="50" fill="#94a3b8" letter-spacing="1"><tspan fill="#f87171" font-weight="bold">1</tspan>0000000 00000000 00000000 0000011<tspan fill="#38bdf8" font-weight="600">0</tspan></text>
      <text x="680" y="50" fill="#38bdf8" font-size="11">[80000006]</text>
      <text x="780" y="50" fill="#34d399" font-size="10">OF=0</text>

      <text x="80" y="85" fill="#f87171" font-size="12" font-weight="bold">1</text>
      <text x="100" y="85" fill="#fbbf24" font-size="11">←</text>
      <text x="140" y="85" fill="#94a3b8" letter-spacing="1"><tspan fill="#34d399" font-weight="bold">0</tspan>0000000 00000000 00000000 000011<tspan fill="#38bdf8" font-weight="600">00</tspan></text>
      <text x="680" y="85" fill="#34d399" font-size="11">[0000000C]</text>
      <text x="780" y="85" fill="#fbbf24" font-size="10">OF=1</text>
    </g>

    <rect x="15" y="205" width="810" height="45" rx="4" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="35" y="224" fill="#34d399" font-size="11">CF = 移出的最高位。SHL 1 时若结果符号位与原来不同，OF=1（符号溢出）。</text>
    <text x="35" y="240" fill="#34d399" font-size="11">第二步：符号位从 1 变 0，正负翻转，所以 OF=1。</text>
  </g>
</svg>
