<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">shl CF/OF 溢出追踪</text>
  <text x="20" y="52" font-size="12" font-weight="bold" fill="#94a3b8">初始：EAX=0xC0000003(负数)，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="130"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="280"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="540"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="580"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="680"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">C0000003</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#ef4444">1</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">00401000</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">最高位为 1，负数</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">shl eax, 1</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">D1E0</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">80000006</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#10b981">1</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401002</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#34d399">CF=1，OF=0(符号位未变)</text>
  </g>

  <g transform="translate(20, 170)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">shl eax, 1</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">D1E0</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">0000000C</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#ef4444">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#fbbf24">1</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#10b981">1</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401004</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#fbbf24">CF=1，OF=1(符号位从1变0)</text>
  </g>

  <rect x="20" y="195" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- 二进制拆解 -->
  <g transform="translate(20, 220)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">二进制拆解</text>

    <g transform="translate(0, 25)" font-family="monospace" font-size="16">
      <text x="140" y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">CF</text>
      <text x="540" y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">OF</text>

      <text x="0"   y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">初始</text>
      <text x="140" y="30" font-weight="bold" fill="#94a3b8">0</text>
      <text x="180" y="30" font-weight="bold" fill="#94a3b8"><tspan fill="#60a5fa">11</tspan>000000 00000000 00000000 00000011</text>

      <text x="0"   y="60" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#10b981">SHL 1</text>
      <text x="140" y="60" font-weight="bold" fill="#60a5fa">1</text>
      <text x="180" y="60" font-weight="bold" fill="#94a3b8"><tspan fill="#60a5fa">1</tspan>0000000 00000000 00000000 0000011<tspan fill="#ef4444">0</tspan></text>
      <text x="540" y="60" font-weight="bold" fill="#94a3b8">0</text>
      <text x="600" y="60" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#fbbf24">&lt;&lt; 左移 1 位</text>

      <text x="0"   y="90" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#10b981">SHL 1</text>
      <text x="140" y="90" font-weight="bold" fill="#60a5fa">1</text>
      <text x="180" y="90" font-weight="bold" fill="#94a3b8"><tspan fill="#10b981">0</tspan>0000000 00000000 00000000 0000110<tspan fill="#ef4444">0</tspan></text>
      <text x="540" y="90" font-weight="bold" fill="#fbbf24">1</text>
      <text x="600" y="90" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#fbbf24">&lt;&lt; 左移 1 位</text>
    </g>

  </g>

  <!-- 总结提示 -->
  <rect x="20" y="370" width="900" height="64" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="40" y="392" font-size="13" font-weight="bold" fill="#60a5fa">CF = 移出的最高位。SHL 1 时若结果符号位与原来不同，OF=1(符号溢出)。</text>
  <text x="40" y="416" font-size="13" font-weight="bold" fill="#60a5fa">第二步：符号位从 1 变 0，正负翻转，所以 OF=1。</text>
</svg>