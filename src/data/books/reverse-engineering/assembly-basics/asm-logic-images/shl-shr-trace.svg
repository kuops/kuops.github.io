<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="13">
  <defs>
    <linearGradient id="eaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="eipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g fill="#94a3b8" font-weight="600" font-size="12" text-anchor="middle">
    <text x="105" y="35">指令</text>
    <text x="310" y="35">EAX</text>
    <text x="400" y="35">ZF</text>
    <text x="440" y="35">SF</text>
    <text x="480" y="35">CF</text>
    <text x="560" y="35">EIP</text>
    <text x="750" y="35">说明</text>
  </g>
  <line x1="30" y1="45" x2="890" y2="45" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g fill="#94a3b8">
    <text x="40" y="72" font-size="12">初始状态</text>
    <text x="290" y="72">00000003</text>
    <text x="396" y="72" text-anchor="middle">0</text>
    <text x="436" y="72" text-anchor="middle">0</text>
    <text x="476" y="72" text-anchor="middle">0</text>
    <text x="530" y="72">00401000</text>
    <text x="630" y="72" font-size="12">数值为 3</text>
  </g>
  <line x1="30" y1="85" x2="890" y2="85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1"/>

  <g>
    <text x="40" y="107" fill="#38bdf8" font-weight="600">shl eax, 2</text>
    <rect x="282" y="92" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="107" fill="#34d399" font-weight="600">0000000C</text>
    <text x="396" y="107" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="107" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="107" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="92" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="107" fill="#60a5fa">00401003</text>
    <text x="630" y="107" fill="#34d399" font-size="12">3 &lt;&lt; 2 = 12 (0xC)，即 3*4</text>
  </g>
  <line x1="30" y1="118" x2="890" y2="118" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>

  <g>
    <text x="40" y="140" fill="#38bdf8" font-weight="600">shl eax, 1</text>
    <rect x="282" y="125" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="140" fill="#34d399" font-weight="600">00000018</text>
    <text x="396" y="140" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="140" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="140" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="125" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="140" fill="#60a5fa">00401005</text>
    <text x="630" y="140" fill="#34d399" font-size="12">12 &lt;&lt; 1 = 24 (0x18)，即 12*2</text>
  </g>
  <line x1="30" y1="151" x2="890" y2="151" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>

  <g>
    <text x="40" y="173" fill="#38bdf8" font-weight="600">shr eax, 3</text>
    <rect x="282" y="158" width="80" height="20" rx="4" fill="url(#eaxGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="290" y="173" fill="#34d399" font-weight="600">00000003</text>
    <text x="396" y="173" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="436" y="173" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <text x="476" y="173" fill="#94a3b8" fill-opacity="0.5" text-anchor="middle">0</text>
    <rect x="522" y="158" width="78" height="20" rx="4" fill="url(#eipGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="530" y="173" fill="#60a5fa">00401008</text>
    <text x="630" y="173" fill="#34d399" font-size="12">24 &gt;&gt; 3 = 3 (0x3)，即 24/8</text>
  </g>
  <line x1="30" y1="184" x2="890" y2="184" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(40, 200)">
    <rect width="840" height="230" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

    <text x="20" y="28" fill="#64748b" font-size="11" font-weight="500">低 8 位逻辑移位流水线视图</text>

    <g transform="translate(20, 45)">
      <text x="0" y="15" fill="#64748b" font-size="11">0. 初始 [0x03]</text>
      <text x="180" y="15" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="15" fill="#94a3b8" letter-spacing="1">000000<tspan fill="#34d399" font-weight="bold">11</tspan></text>

      <text x="0" y="50" fill="#38bdf8" font-size="11">1. SHL 2 [0x0C]</text>
      <text x="180" y="50" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="50" fill="#94a3b8" letter-spacing="1">0000<tspan fill="#34d399" font-weight="bold">11</tspan><tspan fill="#38bdf8" font-weight="600">00</tspan></text>
      <text x="670" y="50" fill="#fbbf24" font-size="11">&lt;&lt; 左移 2 位</text>

      <text x="0" y="85" fill="#38bdf8" font-size="11">2. SHL 1 [0x18]</text>
      <text x="180" y="85" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="85" fill="#94a3b8" letter-spacing="1">000<tspan fill="#34d399" font-weight="bold">11</tspan><tspan fill="#38bdf8" font-weight="600">0</tspan><tspan fill="#475569">00</tspan></text>
      <text x="670" y="85" fill="#fbbf24" font-size="11">&lt;&lt; 左移 1 位</text>

      <line x1="180" y1="102" x2="770" y2="102" stroke="#334155" stroke-width="1.5"/>

      <text x="0" y="135" fill="#34d399" font-size="11">3. SHR 3 [0x03]</text>
      <text x="180" y="135" fill="#475569" letter-spacing="1">00000000 00000000 00000000</text>
      <text x="510" y="135" fill="#475569" letter-spacing="1">000<tspan fill="#38bdf8" font-weight="600">000</tspan><tspan fill="#34d399" font-weight="600">11</tspan></text>
      <text x="670" y="135" fill="#fbbf24" font-size="11">&gt;&gt; 右移 3 位</text>
    </g>

    <rect x="15" y="195" width="810" height="22" rx="4" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
    <text x="35" y="210" fill="#34d399" font-size="10">左移 N 位 = 乘以 2^N，右移 N 位 = 除以 2^N。汇编中用移位代替乘除法更高效。</text>
  </g>
</svg>
