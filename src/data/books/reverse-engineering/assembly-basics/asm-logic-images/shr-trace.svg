<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">shr 逻辑右移追踪</text>
  <text x="20" y="52" font-size="12" font-weight="bold" fill="#94a3b8">初始：EAX=0xF0000010(负数)，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="130"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="280"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="540"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="580"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="680"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">初始状态</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">—</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">F0000010</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#ef4444">1</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">00401000</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#94a3b8">负数</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">shr eax, 4</text>
    <text x="130"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">C1E8 04</text>
    <text x="280"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">0F000001</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" font-weight="bold" fill="#10b981">0</text>
    <text x="460"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="500"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">0</text>
    <text x="540"  y="0" font-size="14" font-weight="bold" fill="#94a3b8">1</text>
    <text x="580"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401003</text>
    <text x="680"  y="0" font-size="13" font-weight="bold" fill="#34d399">高位补 0，符号位变 0</text>
  </g>

  <rect x="20" y="165" width="900" height="1" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- 二进制拆解 -->
  <g transform="translate(20, 190)">
    <text x="0" y="0" font-size="13" fill="#94a3b8" font-weight="bold">二进制拆解</text>

    <g transform="translate(0, 25)" font-family="monospace" font-size="16">
      <text x="0"   y="0"  font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#94a3b8">初始</text>
      <text x="180" y="0"  font-weight="bold" fill="#94a3b8">11110000 00000000 00000000 0001<tspan fill="#60a5fa">0000</tspan></text>

      <text x="0"   y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#10b981">SHR 4</text>
      <text x="180" y="30" font-weight="bold" fill="#94a3b8"><tspan fill="#ef4444">0000</tspan> 11110000 00000000 00000000 0001</text>
      <text x="600" y="30" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-weight="bold" fill="#fbbf24">&gt;&gt; 右移 4 位</text>
    </g>
  </g>

  <!-- 总结提示 -->
  <rect x="20" y="280" width="900" height="44" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="40" y="305" font-size="13" font-weight="bold" fill="#60a5fa">SHR 不管原符号位，高位一律补 0。负数右移后符号丢失，变成正数。</text>
</svg>