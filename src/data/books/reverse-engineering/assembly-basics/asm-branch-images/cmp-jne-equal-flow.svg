<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">cmp + jne 执行流程(相等场景, jne 不跳)</text>

  <g transform="translate(60, 55)">

    <rect x="0" y="0" width="350" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="21" font-family="monospace" font-size="11" fill="#64748b">00401000</text>
    <text x="85" y="21" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">mov eax, 0x64</text>
    <text x="365" y="21" font-size="12" fill="#94a3b8">EAX = 0x64</text>

    <line x1="175" y1="30" x2="175" y2="44" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="171,38 175,44 179,38" fill="#10b981"/>

    <rect x="0" y="44" width="350" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="65" font-family="monospace" font-size="11" fill="#64748b">00401005</text>
    <text x="85" y="65" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">mov ebx, 0x64</text>
    <text x="365" y="65" font-size="12" fill="#94a3b8">EBX = 0x64</text>

    <line x1="175" y1="74" x2="175" y2="88" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="171,82 175,88 179,82" fill="#10b981"/>

    <rect x="0" y="88" width="350" height="30" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="109" font-family="monospace" font-size="11" fill="#64748b">0040100A</text>
    <text x="85" y="109" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">cmp eax, ebx</text>
    <text x="365" y="109" font-size="12" fill="#3b82f6">0x64 - 0x64 = 0, ZF=1</text>

    <line x1="175" y1="118" x2="175" y2="132" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="171,126 175,132 179,126" fill="#10b981"/>

    <rect x="0" y="132" width="350" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="153" font-family="monospace" font-size="11" fill="#64748b">0040100C</text>
    <text x="85" y="153" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">jne 00401020</text>

    <line x1="175" y1="162" x2="175" y2="196" stroke="#10b981" stroke-width="2"/>
    <polygon points="171,190 175,196 179,190" fill="#10b981"/>
    <text x="185" y="180" font-size="11" fill="#10b981" font-weight="bold">ZF=1, 不跳, 继续 ↓</text>

    <path d="M 350 147 L 576 147 Q 580 147 580 151 L 580 196" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
    <polygon points="576,190 580,196 584,190" fill="#94a3b8" fill-opacity="0.3"/>
    <text x="365" y="140" font-size="11" fill="#94a3b8" font-weight="bold">ZF=0 时跳转目标</text>

    <rect x="0" y="196" width="350" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="217" font-family="monospace" font-size="11" fill="#64748b">00401012</text>
    <text x="85" y="217" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">mov ecx, 1</text>
    <text x="365" y="217" font-size="12" fill="#10b981" font-weight="bold">ECX = 1</text>

    <rect x="460" y="196" width="240" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="470" y="217" font-family="monospace" font-size="11" fill="#64748b">00401020</text>
    <text x="545" y="217" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">mov ecx, 0</text>

    <line x1="175" y1="226" x2="175" y2="240" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="171,234 175,240 179,234" fill="#10b981"/>

    <rect x="0" y="240" width="350" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="261" font-family="monospace" font-size="11" fill="#64748b">00401017</text>
    <text x="85" y="261" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">jmp 00401025</text>
    <text x="365" y="261" font-size="12" fill="#94a3b8">跳到汇合点</text>

    <path d="M 175 270 L 175 284" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <polygon points="171,278 175,284 179,278" fill="#10b981"/>

    <path d="M 580 226 L 580 295 Q 580 299 576 299 L 350 299" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
    <polygon points="356,295 350,299 356,303" fill="#94a3b8" fill-opacity="0.3"/>

    <rect x="0" y="284" width="350" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="305" font-family="monospace" font-size="11" fill="#64748b">00401025</text>
    <text x="85" y="305" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">...</text>

  </g>
</svg>
