<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">比较与跳转：三步链条</text>

  <!-- Step 1 -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="110" height="44" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="55" y="18" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">cmp / test</text>
    <text x="55" y="34" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">比较指令</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="136" y1="92" x2="176" y2="92" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="180,92 174,87 174,97" fill="#94a3b8" fill-opacity="0.5"/>
  <text x="158" y="82" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">写</text>

  <!-- Step 2 -->
  <g transform="translate(186, 70)">
    <rect x="0" y="0" width="110" height="44" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="55" y="18" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">EFLAGS</text>
    <text x="55" y="34" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">中间环节</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="302" y1="92" x2="342" y2="92" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="346,92 340,87 340,97" fill="#94a3b8" fill-opacity="0.5"/>
  <text x="324" y="82" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">读</text>

  <!-- Step 3 -->
  <g transform="translate(352, 70)">
    <rect x="0" y="0" width="110" height="44" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="55" y="18" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">jcc</text>
    <text x="55" y="34" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">条件跳转</text>
  </g>
</svg>