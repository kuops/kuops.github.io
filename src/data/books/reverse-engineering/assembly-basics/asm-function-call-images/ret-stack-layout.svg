<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 235" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">ret 前的栈内存布局</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" font-weight="bold">ESP 指向返回地址，即将弹出并跳回调用方</text>
  <rect x="20" y="80" width="200" height="38" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="30" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF30C</text>
  <text x="130" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">00401025</text>
  <text x="240" y="104" font-size="12" font-weight="bold" fill="#fbbf24">← ESP 指向这里(栈顶)</text>
  <rect x="20" y="120" width="200" height="38" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="30" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">012FF310</text>
  <text x="130" y="144" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">(旧数据)</text>
  <text x="20" y="75" font-size="11" fill="#94a3b8" font-weight="bold">↓ 低地址(栈顶)</text>
  <text x="20" y="175" font-size="11" fill="#94a3b8" font-weight="bold">↓ 高地址(栈底)</text>
</svg>
