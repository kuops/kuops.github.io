<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">inc 指令执行状态变化（有符号溢出）</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" opacity="0.6">初始：EAX=0x7FFFFFFF（有符号最大正数），EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="100"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="200"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="300"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="340"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">OF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="460"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">PF</text>
    <text x="500"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="600"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="880" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" fill="#94a3b8">初始状态</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#94a3b8">—</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" fill="#3b82f6">7FFFFFFF</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="380"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="420"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" fill="#94a3b8">1</text>
    <text x="500"  y="0" font-family="monospace" font-size="14" fill="#60a5fa">00401000</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">inc eax</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">40</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#ef4444">80000000</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" font-weight="bold" fill="#ef4444">1</text>
    <text x="380"  y="0" font-size="14" font-weight="bold" fill="#ef4444">1</text>
    <text x="420"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="460"  y="0" font-size="14" fill="#94a3b8">1</text>
    <text x="500"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">00401001</text>
    <text x="600"  y="0" font-size="13" fill="#94a3b8">正+1=负，OF=1；最低字节0个1，PF=1</text>
  </g>
</svg>
