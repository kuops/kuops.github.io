<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">inc/dec 指令执行状态变化（CF 不变）</text>
  <text x="20" y="52" font-size="12" fill="#94a3b8" opacity="0.6">初始：EAX=0x00000009，CF=1，EIP=00401000</text>

  <g transform="translate(20, 80)">
    <text x="0"    y="0" font-size="13" fill="#94a3b8" font-weight="bold">指令</text>
    <text x="100"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">机器码</text>
    <text x="200"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EAX</text>
    <text x="300"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">ZF</text>
    <text x="340"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">SF</text>
    <text x="380"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">CF</text>
    <text x="420"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">EIP</text>
    <text x="520"  y="0" font-size="13" fill="#94a3b8" font-weight="bold">说明</text>
    <rect x="0" y="12" width="880" height="1" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(20, 110)">
    <text x="0"    y="0" font-family="monospace" font-size="14" fill="#94a3b8">初始状态</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#94a3b8">—</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" fill="#3b82f6">00000009</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="380"  y="0" font-size="14" fill="#fbbf24">1</text>
    <text x="420"  y="0" font-family="monospace" font-size="14" fill="#60a5fa">00401000</text>
    <text x="520"  y="0" font-size="13" fill="#94a3b8">注意 CF=1</text>
  </g>

  <g transform="translate(20, 140)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">inc eax</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">40</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">0000000A</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="380"  y="0" font-size="14" fill="#fbbf24">1</text>
    <text x="420"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">00401001</text>
    <text x="520"  y="0" font-size="13" fill="#94a3b8">9+1=10(0xA)，CF 不变</text>
  </g>

  <g transform="translate(20, 170)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">dec eax</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">48</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000009</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="380"  y="0" font-size="14" fill="#fbbf24">1</text>
    <text x="420"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">00401002</text>
    <text x="520"  y="0" font-size="13" fill="#94a3b8">10-1=9，CF 仍为 1</text>
  </g>

  <g transform="translate(20, 200)">
    <text x="0"    y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">dec eax</text>
    <text x="100"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">48</text>
    <text x="200"  y="0" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">00000008</text>
    <text x="300"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="340"  y="0" font-size="14" fill="#94a3b8">0</text>
    <text x="380"  y="0" font-size="14" fill="#fbbf24">1</text>
    <text x="420"  y="0" font-family="monospace" font-size="14" fill="#fbbf24">00401003</text>
    <text x="520"  y="0" font-size="13" fill="#94a3b8">继续减，CF 不动</text>
  </g>
</svg>
