<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 325" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <!-- 标题 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">数组指针步长: int* p+1 vs int(*)[4] row+1</text>

  <!-- ========== 上: int* p, p+1 跳 4 字节 ========== -->
  <text x="20" y="62" font-size="13" font-weight="bold" fill="#94a3b8">int *p = &amp;matrix[0][0]  →  p+1 跳 1 个元素 (4 字节)</text>

  <g transform="translate(40, 75)">
    <!-- 12 格子 50×26, gap 2 -->
    <!-- 第 0 行 -->
    <rect x="0" y="0" width="50" height="26" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="25" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">[0][0]</text>
    <rect x="52" y="0" width="50" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="77" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">[0][1]</text>
    <rect x="104" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="129" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][2]</text>
    <rect x="156" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="181" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][3]</text>
    <!-- 第 1 行 -->
    <rect x="208" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="233" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][0]</text>
    <rect x="260" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="285" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][1]</text>
    <rect x="312" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="337" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][2]</text>
    <rect x="364" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="389" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][3]</text>
    <!-- 第 2 行 -->
    <rect x="416" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="441" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][0]</text>
    <rect x="468" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="493" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][1]</text>
    <rect x="520" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="545" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][2]</text>
    <rect x="572" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="597" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][3]</text>
  </g>

  <!-- p 箭头: [0][0] → [0][1], 跳 1 格 -->
  <line x1="65" y1="113" x2="65" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="65" y1="130" x2="117" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="117" y1="130" x2="117" y2="113" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="113,116 117,110 121,116" fill="#fbbf24" fill-opacity="0.5"/>
  <text x="91" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">+4</text>
  <text x="91" y="161" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">add eax, 4</text>

  <!-- 分割线 -->
  <line x1="20" y1="180" x2="820" y2="180" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ========== 下: int(*)[4] row, row+1 跳 16 字节 ========== -->
  <text x="20" y="202" font-size="13" font-weight="bold" fill="#94a3b8">int (*row)[4] = matrix  →  row+1 跳 1 整行 (16 字节)</text>

  <g transform="translate(40, 215)">
    <!-- 同样 12 格子 -->
    <rect x="0" y="0" width="50" height="26" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="25" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">[0][0]</text>
    <rect x="52" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="77" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][1]</text>
    <rect x="104" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="129" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][2]</text>
    <rect x="156" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="181" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][3]</text>
    <rect x="208" y="0" width="50" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="233" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">[1][0]</text>
    <rect x="260" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="285" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][1]</text>
    <rect x="312" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="337" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][2]</text>
    <rect x="364" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="389" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][3]</text>
    <rect x="416" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="441" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][0]</text>
    <rect x="468" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="493" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][1]</text>
    <rect x="520" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="545" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][2]</text>
    <rect x="572" y="0" width="50" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="597" y="18" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][3]</text>
  </g>

  <!-- row 箭头: [0][0] → [1][0], 跳 4 格 -->
  <line x1="65" y1="253" x2="65" y2="270" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="65" y1="270" x2="273" y2="270" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="273" y1="270" x2="273" y2="253" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="269,256 273,250 277,256" fill="#fbbf24" fill-opacity="0.5"/>
  <text x="169" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">+16</text>
  <text x="169" y="301" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">add eax, 0x10</text>

</svg>
