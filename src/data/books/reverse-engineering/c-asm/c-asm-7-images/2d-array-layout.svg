<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <!-- 标题 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">二维数组: 逻辑视图与内存布局 (int arr[3][4])</text>

  <!-- ========== 上: 逻辑视图 3×4 矩阵 ========== -->
  <g transform="translate(40, 65)">
    <!-- 格子 70×32, 间距 6, 4列总宽 298 -->
    <!-- 列号 -->
    <text x="38" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">j=0</text>
    <text x="114" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">j=1</text>
    <text x="190" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">j=2</text>
    <text x="266" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">j=3</text>

    <!-- 行 0 -->
    <text x="-15" y="29" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">i=0</text>
    <rect x="3" y="8" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="38" y="29" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][0]</text>
    <rect x="79" y="8" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="114" y="29" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][1]</text>
    <rect x="155" y="8" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="190" y="29" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][2]</text>
    <rect x="231" y="8" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="266" y="29" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][3]</text>

    <!-- 行 1, 高亮 [1][2] -->
    <text x="-15" y="69" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">i=1</text>
    <rect x="3" y="48" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="38" y="69" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][0]</text>
    <rect x="79" y="48" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="114" y="69" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][1]</text>
    <rect x="155" y="48" width="70" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="190" y="69" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">[1][2]</text>
    <rect x="231" y="48" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="266" y="69" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][3]</text>

    <!-- 行 2 -->
    <text x="-15" y="109" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">i=2</text>
    <rect x="3" y="88" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="38" y="109" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][0]</text>
    <rect x="79" y="88" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="114" y="109" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][1]</text>
    <rect x="155" y="88" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="190" y="109" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][2]</text>
    <rect x="231" y="88" width="70" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="266" y="109" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][3]</text>
  </g>
  <!-- 矩阵 x: 200~501, y: 65~185 -->

  <!-- 逻辑视图标签 (放矩阵右侧) -->
  <text x="355" y="120" font-size="11" font-weight="bold" fill="#64748b">逻辑视图</text>
  <text x="355" y="138" font-size="11" font-weight="bold" fill="#64748b">(3 行 × 4 列)</text>

  <!-- 分割线 -->
  <line x1="20" y1="200" x2="820" y2="200" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ========== 下: 内存布局 (一维连续) ========== -->
  <text x="420" y="220" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">内存布局 (一维连续, 48 字节)</text>

  <g transform="translate(40, 230)">
    <!-- 12 格子 60×32 -->
    <!-- +0 基址: 黄色 -->
    <rect x="0" y="0" width="60" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="30" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">[0][0]</text>
    <text x="30" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+0</text>

    <rect x="60" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="90" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][1]</text>
    <text x="90" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+4</text>

    <rect x="120" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="150" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][2]</text>
    <text x="150" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+8</text>

    <rect x="180" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="210" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[0][3]</text>
    <text x="210" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+12</text>

    <!-- +16: 黄色 -->
    <rect x="240" y="0" width="60" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="270" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">[1][0]</text>
    <text x="270" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+16</text>

    <rect x="300" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="330" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][1]</text>
    <text x="330" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+20</text>

    <!-- +24: 蓝色 (目标) -->
    <rect x="360" y="0" width="60" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="390" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">[1][2]</text>
    <text x="390" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">+24</text>

    <rect x="420" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="450" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[1][3]</text>
    <text x="450" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+28</text>

    <rect x="480" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="510" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][0]</text>
    <text x="510" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+32</text>

    <rect x="540" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="570" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][1]</text>
    <text x="570" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+36</text>

    <rect x="600" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="630" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][2]</text>
    <text x="630" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+40</text>

    <rect x="660" y="0" width="60" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="690" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[2][3]</text>
    <text x="690" y="27" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+44</text>

    <!-- 行分组标注 -->
    <text x="120" y="53" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">第 0 行</text>
    <text x="360" y="53" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">第 1 行</text>
    <text x="600" y="53" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">第 2 行</text>

    <!-- 连接线: 高亮格子 → 信息框 -->
    <line x1="30" y1="32" x2="30" y2="70" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="270" y1="32" x2="270" y2="70" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="390" y1="32" x2="390" y2="70" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- 信息框: ①基址 ②行偏移 ③列偏移 -->
    <rect x="-20" y="70" width="100" height="40" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="30" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">① 基址 +0</text>
    <text x="30" y="102" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">lea eax, arr</text>

    <rect x="220" y="70" width="100" height="40" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="270" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">② 行偏移 +16</text>
    <text x="270" y="102" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">shl eax, 4</text>

    <rect x="340" y="70" width="100" height="40" rx="4" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="390" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">③ 列偏移 +8</text>
    <text x="390" y="102" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">[ecx*4]</text>
  </g>
  <!-- 最低点 = 230 + 70 + 40 = 340, +20 = 360 -->

</svg>
