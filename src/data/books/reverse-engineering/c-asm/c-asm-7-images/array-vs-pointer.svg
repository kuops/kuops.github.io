<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <!-- 标题 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">数组 vs 指针: 访问 [2] 的汇编区别</text>

  <!-- ========== 左: 数组 ========== -->
  <text x="153" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">数组: 直接栈偏移</text>

  <g transform="translate(78, 78)">
    <text x="-8" y="18" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">[ebp-8]</text>
    <rect x="0" y="0" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="18" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">arr[4]</text>

    <text x="-8" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">[ebp-C]</text>
    <rect x="0" y="30" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">arr[3]</text>

    <text x="-8" y="78" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#3b82f6">[ebp-10]</text>
    <rect x="0" y="60" width="150" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="75" y="78" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">arr[2] ← 目标</text>

    <text x="-8" y="108" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">[ebp-14]</text>
    <rect x="0" y="90" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="108" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">arr[1]</text>

    <text x="-8" y="138" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">[ebp-18]</text>
    <rect x="0" y="120" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="138" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">arr[0]</text>
  </g>

  <!-- 分隔线 -->
  <line x1="260" y1="60" x2="260" y2="210" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ========== 右: 指针 ========== -->
  <text x="449" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">指针: 先读指针再访问</text>

  <!-- 栈: ptr -->
  <g transform="translate(290, 78)">
    <rect x="0" y="0" width="110" height="26" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="55" y="18" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">ptr</text>
    <text x="55" y="42" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">[ebp-8]</text>
  </g>

  <!-- 指针箭头 ptr → data -->
  <line x1="400" y1="91" x2="448" y2="91" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="444,88 450,91 444,94" fill="#fbbf24" fill-opacity="0.5"/>

  <!-- 静态区 data -->
  <g transform="translate(450, 78)">
    <text x="158" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">+16</text>
    <rect x="0" y="0" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="18" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">data[4]</text>

    <text x="158" y="48" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">+12</text>
    <rect x="0" y="30" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">data[3]</text>

    <text x="158" y="78" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">+8</text>
    <rect x="0" y="60" width="150" height="26" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="75" y="78" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">data[2] ← 目标</text>

    <text x="158" y="108" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">+4</text>
    <rect x="0" y="90" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="108" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">data[1]</text>

    <text x="158" y="138" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">+0</text>
    <rect x="0" y="120" width="150" height="26" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="138" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">data[0]</text>
  </g>

</svg>
