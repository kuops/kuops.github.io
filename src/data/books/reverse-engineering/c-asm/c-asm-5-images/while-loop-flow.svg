<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 314" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">while 循环汇编结构 (无前置 jmp)</text>

  <!-- Box 1: check -->
  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">check:</text>
    <text x="60" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">cmp n, 0</text>
    <text x="250" y="20" font-size="11" font-weight="bold" fill="#64748b">条件检查</text>
  </g>

  <line x1="195" y1="85" x2="195" y2="99" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="191,93 195,99 199,93" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- Box 2: je end (decision) -->
  <g transform="translate(40, 99)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">je end</text>
  </g>

  <!-- je taken: yellow bypass to end (x=390 channel) -->
  <path d="M 350 114 L 385 114 Q 390 114 390 119 L 390 242 Q 390 247 385 247 L 354 247" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="358,243 354,247 358,251" fill="#fbbf24"/>
  <text x="400" y="210" font-size="11" font-weight="bold" fill="#fbbf24">n == 0, 跳出循环</text>

  <!-- je not taken: fall-through to loop_body (34px decision) -->
  <line x1="195" y1="129" x2="195" y2="163" stroke="#10b981" stroke-width="2"/>
  <polygon points="191,157 195,163 199,157" fill="#10b981"/>
  <text x="205" y="150" font-size="11" font-weight="bold" fill="#10b981">n != 0, 继续</text>

  <!-- Box 3: loop_body -->
  <g transform="translate(40, 163)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">loop_body:</text>
    <text x="250" y="20" font-size="11" font-weight="bold" fill="#64748b">循环体</text>
  </g>

  <line x1="195" y1="193" x2="195" y2="207" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="191,201 195,207 199,201" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- Box 4: jmp check (back-edge) -->
  <g transform="translate(40, 207)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">jmp check</text>
    <text x="250" y="20" font-size="11" font-weight="bold" fill="#3b82f6">跳回检查</text>
  </g>

  <!-- jmp check: blue back-edge to check (left x=20 channel, upward) -->
  <path d="M 40 222 L 25 222 Q 20 222 20 217 L 20 75 Q 20 70 25 70 L 40 70" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="36,66 40,70 36,74" fill="#3b82f6"/>

  <!-- Box 5: end -->
  <g transform="translate(40, 251)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">end:</text>
    <text x="250" y="20" font-size="11" font-weight="bold" fill="#64748b">循环结束</text>
  </g>

</svg>
