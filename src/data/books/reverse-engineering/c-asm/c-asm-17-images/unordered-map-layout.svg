<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">unordered_map 对象布局</text>

  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="210" height="105" rx="6" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="18" y="24" font-size="13" font-weight="bold" fill="#60a5fa">Traits (4 字节)</text>
    <rect x="18" y="40" width="174" height="45" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="105" y="59" font-size="11" font-weight="bold" text-anchor="middle" fill="#60a5fa">+0 max_load_factor</text>
    <text x="105" y="75" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">float，样本值 1.0</text>

    <rect x="240" y="0" width="660" height="105" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="258" y="24" font-size="13" font-weight="bold" fill="#34d399">元素链表 List (12 字节)</text>

    <rect x="258" y="40" width="190" height="45" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="353" y="59" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">+4 Debug proxy</text>
    <text x="353" y="75" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">迭代器调试用</text>

    <rect x="458" y="40" width="190" height="45" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="553" y="59" font-size="11" font-weight="bold" text-anchor="middle" fill="#34d399">+8 _Myhead</text>
    <text x="553" y="75" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">哨兵节点指针</text>

    <rect x="658" y="40" width="224" height="45" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="770" y="59" font-size="11" font-weight="bold" text-anchor="middle" fill="#34d399">+C _Mysize</text>
    <text x="770" y="75" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">元素个数</text>
  </g>

  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="570" height="115" rx="6" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="18" y="24" font-size="13" font-weight="bold" fill="#60a5fa">桶向量 Bucket vector (16 字节)</text>

    <rect x="18" y="42" width="120" height="48" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="78" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+10 proxy</text>
    <text x="78" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">调试用</text>

    <rect x="148" y="42" width="125" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="210" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#60a5fa">+14 _Myfirst</text>
    <text x="210" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">桶边界数组</text>

    <rect x="283" y="42" width="125" height="48" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="345" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+18 _Mylast</text>
    <text x="345" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">末尾</text>

    <rect x="418" y="42" width="134" height="48" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="485" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+1C _Myend</text>
    <text x="485" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">容量末尾</text>

    <rect x="600" y="0" width="300" height="115" rx="6" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="618" y="24" font-size="13" font-weight="bold" fill="#fbbf24">索引元数据 (8 字节)</text>

    <rect x="618" y="42" width="126" height="48" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="681" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+20 _Mask</text>
    <text x="681" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">hash 取桶</text>

    <rect x="754" y="42" width="128" height="48" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="818" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+24 bucket_count</text>
    <text x="818" y="79" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">公开桶数量</text>
  </g>
</svg>
