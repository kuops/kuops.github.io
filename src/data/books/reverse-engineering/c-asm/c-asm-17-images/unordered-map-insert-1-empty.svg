<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">unordered_map 空表：对象、哨兵、桶数组</text>

  <!-- 对象 0x0053FD64 -->
  <g transform="translate(20, 60)">
    <text x="200" y="0" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">对象 scores 地址：  0x10FF9D8 (40 字节)</text>

    <!-- +0x00 max_load_factor -->
    <rect x="0" y="14" width="100" height="40" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="50" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0x00</text>
    <text x="50" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">max_load_factor</text>

    <!-- +0x04 List proxy -->
    <rect x="100" y="14" width="60" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="130" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0x04</text>
    <text x="130" y="46" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">List proxy</text>

    <!-- +0x08 _Myhead -->
    <rect x="160" y="14" width="100" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="210" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#34d399">+0x08</text>
    <text x="210" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#34d399">_Myhead</text>

    <!-- +0x0C _Mysize -->
    <rect x="260" y="14" width="100" height="40" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="310" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#60a5fa">+0x0C</text>
    <text x="310" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#60a5fa">_Mysize</text>

    <!-- +0x10 Bucket proxy -->
    <rect x="360" y="14" width="60" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="390" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0x10</text>
    <text x="390" y="46" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">Bkt proxy</text>

    <!-- +0x14 _Myfirst -->
    <rect x="420" y="14" width="100" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="470" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#34d399">+0x14</text>
    <text x="470" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#34d399">_Myfirst</text>

    <!-- +0x18 _Mylast -->
    <rect x="520" y="14" width="100" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="570" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0x18</text>
    <text x="570" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">_Mylast</text>

    <!-- +0x1C _Myend -->
    <rect x="620" y="14" width="100" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="670" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0x1C</text>
    <text x="670" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">_Myend</text>

    <!-- +0x20 _Mask -->
    <rect x="720" y="14" width="100" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="770" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+0x20</text>
    <text x="770" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">_Mask</text>

    <!-- +0x24 _Maxidx -->
    <rect x="820" y="14" width="100" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="870" y="31" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">+0x24</text>
    <text x="870" y="46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">_Maxidx</text>

    <!-- 第二行：实际值 -->
    <text x="50" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">00 00 80 3F</text>
    <text x="50" y="85" font-size="9" text-anchor="middle" fill="#94a3b8">1.0f</text>

    <text x="210" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#34d399">80 75 24 01</text>
    <text x="210" y="85" font-size="9" text-anchor="middle" fill="#34d399">→ 0x1247580</text>

    <text x="310" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#60a5fa">00 00 00 00</text>
    <text x="310" y="85" font-size="9" text-anchor="middle" fill="#60a5fa">= 0 (空表)</text>

    <text x="470" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#34d399">F8 65 24 01</text>
    <text x="470" y="85" font-size="9" text-anchor="middle" fill="#34d399">→ 0x12465F8</text>

    <text x="770" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">07 00 00 00</text>
    <text x="770" y="85" font-size="9" text-anchor="middle" fill="#fbbf24">= 7</text>

    <text x="870" y="72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">08 00 00 00</text>
    <text x="870" y="85" font-size="9" text-anchor="middle" fill="#fbbf24">= 8 (桶数)</text>
  </g>

  <!-- 箭头：_Myhead → 哨兵 -->
  <path d="M 230 150 L 230 187 Q 230 191 226 191 L 102 191 Q 98 191 98 195 L 98 232" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="94,232 102,232 98,240" fill="#10b981"/>
  <text x="145" y="186" font-size="10" font-weight="bold" fill="#34d399">哨兵</text>

  <!-- 箭头：_Myfirst → 桶数组 -->
  <path d="M 490 150 L 490 187 Q 490 191 494 191 L 682 191 Q 690 191 690 195 L 690 232" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="686,232 694,232 690,240" fill="#10b981"/>
  <text x="575" y="186" font-size="10" font-weight="bold" fill="#34d399">桶数组</text>

  <!-- 哨兵 0x1247580 -->
  <g transform="translate(20, 244)">

    <rect x="0" y="14" width="160" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="80" y="32" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">+0x00 _Next</text>
    <text x="80" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">80 75 24 01</text>

    <rect x="0" y="60" width="160" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="80" y="78" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">+0x04 _Prev</text>
    <text x="80" y="94" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">80 75 24 01</text>
  </g>

  <!-- 桶数组 0x12465F8 -->
  <g transform="translate(560, 244)">

    <text x="22" y="24" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">bucket</text>
    <text x="90" y="24" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">low</text>
    <text x="170" y="24" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">high</text>

    <!-- bucket 0 -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="44" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="22" y="20" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="44" y="0" width="92" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="90" y="20" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">80 75 24 01</text>
      <rect x="136" y="0" width="92" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="182" y="20" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">80 75 24 01</text>
    </g>

    <!-- 省略号 -->
    <text x="90" y="74" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">...</text>
    <text x="182" y="74" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">...</text>

    <!-- bucket 7 -->
    <g transform="translate(0, 86)">
      <rect x="0" y="0" width="44" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="22" y="20" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#94a3b8">7</text>
      <rect x="44" y="0" width="92" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="90" y="20" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">80 75 24 01</text>
      <rect x="136" y="0" width="92" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="182" y="20" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#94a3b8">80 75 24 01</text>
    </g>

  </g>

  <!-- 底部说明 -->
  <g transform="translate(20, 410)">
    <rect x="0" y="0" width="920" height="60" rx="6" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-size="12" font-weight="bold" text-anchor="middle" fill="#60a5fa">空表状态：_Mysize=0，哨兵自环，8 个 bucket 全指向哨兵</text>
    <text x="460" y="42" font-size="11" text-anchor="middle" fill="#94a3b8">三个"空"的标志：对象 _Mysize=0 / 哨兵 _Next=_Prev=0x1247580 / bucket [low=high=0x1247580]</text>
  </g>
</svg>
