<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">catch 执行到函数退出的控制流</text>

  <!-- BB1: catch funclet -->
  <g transform="translate(245, 55)">
    <rect x="0" y="0" width="350" height="128" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">__catch$test_exception$0</text>
    <text x="10" y="36" font-family="monospace" font-size="12" fill="#f59e0b">+0x89  mov eax, [ebp-28]</text>
    <text x="10" y="54" font-family="monospace" font-size="12" fill="#f59e0b">+0x8C  push eax</text>
    <text x="10" y="72" font-family="monospace" font-size="12" fill="#f59e0b">+0x8D  push offset "caught: %d"</text>
    <text x="10" y="90" font-family="monospace" font-size="12" fill="#f59e0b">+0x92  call _printf</text>
    <text x="10" y="108" font-family="monospace" font-size="12" fill="#f59e0b">+0x97  add esp, 8</text>
    <text x="10" y="126" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">+0x9A  mov eax, offset $LN8</text>
  </g>

  <!-- catch ret 边（运行时恢复） -->
  <path d="M 420 183 L 420 210" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="416,204 420,210 424,204" fill="#fbbf24" fill-opacity="0.5"/>
  <text x="430" y="200" font-size="11" font-weight="bold" fill="#f59e0b">+0x9F ret</text>
  <text x="430" y="214" font-size="11" fill="#94a3b8">返回给运行时</text>

  <!-- BB2: 正常路径 done -->
  <g transform="translate(50, 235)">
    <rect x="0" y="0" width="230" height="56" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">test_exception (done)</text>
    <text x="10" y="36" font-family="monospace" font-size="12" fill="#34d399">+0xA0  mov [ebp-4], 0</text>
    <text x="10" y="54" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399">+0xA7  jmp +0xB0</text>
  </g>

  <!-- 正常路径 jmp 到汇合点 -->
  <path d="M 165 291 L 165 370 Q 165 375 170 375 L 415 375 Q 420 375 420 380" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="416,374 420,380 424,374" fill="#10b981"/>
  <text x="180" y="345" font-size="11" font-weight="bold" fill="#10b981">正常路径, 跳过 $LN8</text>

  <!-- BB3: $LN8 (catch 返回后) -->
  <g transform="translate(560, 235)">
    <rect x="0" y="0" width="230" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">$LN8</text>
    <text x="10" y="36" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">+0xA9  mov [ebp-4], 0</text>
  </g>

  <!-- 运行时恢复边 -->
  <path d="M 420 210 L 420 225 Q 420 230 425 230 L 615 230 Q 620 230 620 235" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="616,229 620,235 624,229" fill="#fbbf24"/>
  <text x="430" y="224" font-size="11" font-weight="bold" fill="#fbbf24">运行时恢复到 $LN8</text>

  <!-- $LN8 到汇合点 -->
  <path d="M 675 275 L 675 360 Q 675 365 670 365 L 425 365 Q 420 365 420 370" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="416,364 420,370 424,364" fill="#fbbf24"/>

  <!-- BB4: 汇合点 +0xB0 -->
  <g transform="translate(245, 380)">
    <rect x="0" y="0" width="350" height="92" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">test_exception (汇合点)</text>
    <text x="10" y="36" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">+0xB0  mov [ebp-4], 0xFFFFFFFF</text>
    <text x="10" y="54" font-family="monospace" font-size="12" fill="#60a5fa">+0xB7  lea ecx, [ebp-1C]</text>
    <text x="10" y="72" font-family="monospace" font-size="12" fill="#60a5fa">+0xBA  call Guard::~Guard</text>
    <text x="10" y="90" font-family="monospace" font-size="12" fill="#60a5fa">+0xD4  mov fs:[0], ecx</text>
  </g>

  <!-- 汇合点到 ret -->
  <line x1="420" y1="472" x2="420" y2="500" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="416,494 420,500 424,494" fill="#3b82f6"/>

  <!-- BB5: ret -->
  <g transform="translate(245, 500)">
    <rect x="0" y="0" width="350" height="30" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">test_exception</text>
    <text x="155" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">+0xF9  ret</text>
    <text x="365" y="20" font-size="11" fill="#94a3b8">函数返回</text>
  </g>

</svg>
