<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">struct Flags 位域写操作: 每步执行后的 bit 变化</text>

  <!-- 列标题: 操作 | bit7-6 reserved | bit5-3 level | bit2 exe | bit1 write | bit0 read | 说明 -->
  <g transform="translate(30, 58)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#64748b">操作</text>
    <text x="180" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">7</text>
    <text x="220" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">6</text>
    <text x="260" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">5</text>
    <text x="300" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">4</text>
    <text x="340" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">3</text>
    <text x="380" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">2</text>
    <text x="420" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#10b981">1</text>
    <text x="460" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">0</text>
    <text x="540" y="0" font-size="12" font-weight="bold" fill="#64748b">说明</text>
  </g>

  <!-- 初始值 0x00 -->
  <g transform="translate(30, 78)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">初始值</text>
    <!-- reserved bits 7-6: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level bits 5-3: 000 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- execute bit 2: 0 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- write bit 1: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- read bit 0: 0 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- 说明 -->
    <text x="540" y="22" font-size="11" fill="#64748b">0x00, 全 0</text>
  </g>

  <!-- 步骤1: f.read = 1 → or eax, 1 → bit0 变 1 -->
  <g transform="translate(30, 128)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#3b82f6">f.read = 1</text>
    <!-- reserved: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 000 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- execute: 0 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- write: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- read: 1 (高亮) -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">or eax, 1</text>
    <text x="540" y="32" font-size="11" fill="#3b82f6">bit0 设 1</text>
  </g>

  <!-- 步骤2: f.write = 0 → and 0xFFFFFFFD → bit1 清 0 -->
  <g transform="translate(30, 178)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">f.write = 0</text>
    <!-- reserved: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 000 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- execute: 0 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- write: 0 (高亮) -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0</text>
    <!-- read: 1 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">and eax, 0xFFFFFFFD</text>
    <text x="540" y="32" font-size="11" fill="#10b981">bit1 清 0</text>
  </g>

  <!-- 步骤3: f.execute = 1 → or 4 → bit2 变 1 -->
  <g transform="translate(30, 228)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24">f.execute = 1</text>
    <!-- reserved: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 000 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- execute: 1 (高亮) -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">1</text>
    <!-- write: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0</text>
    <!-- read: 1 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">or eax, 4</text>
    <text x="540" y="32" font-size="11" fill="#fbbf24">bit2 设 1</text>
  </g>

  <!-- 步骤4: f.level = 5 → and 0xFFFFFFC7, or 0x28 → bit3-5 变 101 -->
  <g transform="translate(30, 278)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">f.level = 5</text>
    <!-- reserved: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 101 (高亮) -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <!-- execute: 1 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">1</text>
    <!-- write: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0</text>
    <!-- read: 1 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="10" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">and eax, 0xFFFFFFC7</text>
    <text x="540" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">or eax, 0x28</text>
    <text x="540" y="42" font-size="11" fill="#f59e0b">bit3-5 写 101</text>
  </g>

  <!-- 步骤5: f.reserved = 0 → and 0xFFFFFF3F → bit6-7 清 0 -->
  <g transform="translate(30, 338)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#64748b">f.reserved = 0</text>
    <!-- reserved: 00 (高亮) -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="#64748b" fill-opacity="0.08" stroke="#64748b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 101 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <!-- execute: 1 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">1</text>
    <!-- write: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0</text>
    <!-- read: 1 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">and eax, 0xFFFFFF3F</text>
    <text x="540" y="32" font-size="11" fill="#64748b">bit6-7 清 0</text>
  </g>

  <!-- 最终值 -->
  <g transform="translate(30, 398)">
    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">最终值</text>
    <!-- reserved: 00 -->
    <rect x="160" y="2" width="80" height="32" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="180" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <text x="220" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b">0</text>
    <!-- level: 101 -->
    <rect x="240" y="2" width="120" height="32" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="260" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <text x="300" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">0</text>
    <text x="340" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">1</text>
    <!-- execute: 1 -->
    <rect x="360" y="2" width="40" height="32" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="380" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">1</text>
    <!-- write: 0 -->
    <rect x="400" y="2" width="40" height="32" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="420" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0</text>
    <!-- read: 1 -->
    <rect x="440" y="2" width="40" height="32" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="460" y="22" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">1</text>
    <!-- 说明 -->
    <text x="540" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">0x2D = 00101101</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(30, 470)">
    <text x="0" y="0" font-size="12" fill="#94a3b8">高亮 = 当前步骤改变的位。每步先读整个 int, 用 and 清除目标位, 用 or 写入新值, 再写回。</text>
    <text x="0" y="20" font-size="12" fill="#94a3b8">写 0 只需 and 清除; 写 1 需要 and 清除旧值 + or 写入新值。</text>
  </g>

</svg>
