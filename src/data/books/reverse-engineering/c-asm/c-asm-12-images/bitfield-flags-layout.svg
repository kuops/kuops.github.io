<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">struct Flags 位域布局 (8 bit, 1 字节)</text>

  <!-- bit 编号: bit 0 在左(低地址), bit 7 在右(高地址), 每个 bit 宽 80 -->
  <g transform="translate(60, 62)">
    <text x="40" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">bit 0</text>
    <text x="120" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#10b981">1</text>
    <text x="200" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">2</text>
    <text x="280" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">3</text>
    <text x="360" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">4</text>
    <text x="440" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#f59e0b">5</text>
    <text x="520" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">6</text>
    <text x="600" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">7</text>
  </g>

  <!-- 字段矩形: bit 0 在左, bit 7 在右 -->
  <g transform="translate(60, 70)">
    <!-- read: bit 0, 1 位 = 80px -->
    <rect x="0" y="0" width="80" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="40" y="22" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">read</text>
    <text x="40" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">1 位</text>

    <!-- write: bit 1, 1 位 = 80px -->
    <rect x="80" y="0" width="80" height="48" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="120" y="22" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">write</text>
    <text x="120" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#10b981">1 位</text>

    <!-- execute: bit 2, 1 位 = 80px -->
    <rect x="160" y="0" width="80" height="48" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="200" y="22" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">execute</text>
    <text x="200" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">1 位</text>

    <!-- level: bit 3-5, 3 位 = 240px -->
    <rect x="240" y="0" width="240" height="48" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="360" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#f59e0b">level</text>
    <text x="360" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#f59e0b">3 位</text>

    <!-- reserved: bit 6-7, 2 位 = 160px -->
    <rect x="480" y="0" width="160" height="48" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="560" y="22" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">reserved</text>
    <text x="560" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">2 位</text>
  </g>

  <!-- 低/高地址 -->
  <g transform="translate(60, 135)">
    <text x="40" y="0" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">低地址</text>
    <text x="560" y="0" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">高地址</text>
  </g>

</svg>
