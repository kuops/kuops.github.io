<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">struct Player 内存布局 (无 padding, sizeof=12)</text>

  <!-- Offset labels: 每字节宽 60, 起点 x=100, 标签居中对齐字段 -->
  <g transform="translate(30, 62)">
    <text x="120" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">0-3</text>
    <text x="360" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">4-7</text>
    <text x="600" y="0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">8-B</text>
  </g>

  <!-- 字段矩形: 起点 x=30, 每字节 60px -->
  <g transform="translate(30, 70)">
    <!-- hp: offset 0-3, 4 bytes = 240px -->
    <rect x="0" y="0" width="240" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="120" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">hp</text>
    <text x="120" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">int (4 字节)</text>

    <!-- mp: offset 4-7, 4 bytes = 240px -->
    <rect x="240" y="0" width="240" height="48" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="360" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">mp</text>
    <text x="360" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#10b981">int (4 字节)</text>

    <!-- level: offset 8-B, 4 bytes = 240px -->
    <rect x="480" y="0" width="240" height="48" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="600" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">level</text>
    <text x="600" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">int (4 字节)</text>
  </g>

  <!-- 汇编映射 -->
  <g transform="translate(30, 140)">
    <text x="120" y="0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">[eax]</text>
    <text x="360" y="0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">[eax+4]</text>
    <text x="600" y="0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#fbbf24">[eax+8]</text>
  </g>

  <!-- 低/高地址 -->
  <g transform="translate(30, 165)">
    <text x="120" y="0" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">低地址</text>
    <text x="600" y="0" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">高地址</text>
  </g>

</svg>
