<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">指针赋值与解引用: 三个位置的变化</text>

  <!-- Column headers -->
  <text x="20" y="62" font-size="12" font-weight="bold" fill="#64748b">C 语句</text>
  <text x="160" y="62" font-size="12" font-weight="bold" fill="#64748b">汇编</text>

  <!-- ============================================ -->
  <!-- PHASE 1: a = 42                              -->
  <!-- ============================================ -->
  <g transform="translate(0, 75)">
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">a = 42</text>
    <text x="160" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">mov [ebp-C], 0x2A</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; 往 a 的地址写 42</text>

    <!-- eax: empty -->
    <rect x="490" y="10" width="90" height="50" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="535" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="535" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">??</text>

    <!-- p: empty -->
    <rect x="590" y="10" width="90" height="50" rx="4" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="635" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="635" y="48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">??</text>

    <!-- a: 0x2A (written!) -->
    <rect x="690" y="10" width="90" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="735" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="735" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="535" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="635" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="735" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="165" x2="820" y2="165" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 2: p = &a                              -->
  <!-- ============================================ -->
  <g transform="translate(0, 180)">
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">p = &amp;a</text>
    <text x="160" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">lea eax, [ebp-C]</text>
    <text x="160" y="48" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">mov [ebp-18], eax</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; a 的地址存到 p</text>

    <!-- eax: 0x19FEF4 (a's address) -->
    <rect x="490" y="10" width="90" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="535" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="535" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: 0x19FEF4 (a's address stored!) -->
    <rect x="590" y="10" width="90" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="635" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="635" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x2A (unchanged) -->
    <rect x="690" y="10" width="90" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="735" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="735" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="535" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="635" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="735" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="270" x2="820" y2="270" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 3: *p = 100                            -->
  <!-- ============================================ -->
  <g transform="translate(0, 285)">
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">*p = 100</text>
    <text x="160" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">mov eax, [ebp-18]</text>
    <text x="160" y="48" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">mov [eax], 0x64</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 p 得地址, 写 100</text>

    <!-- eax: 0x19FEF4 (read from p) -->
    <rect x="490" y="10" width="90" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="535" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="535" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: 0x19FEF4 (unchanged) -->
    <rect x="590" y="10" width="90" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="635" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="635" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x64 (overwritten!) -->
    <rect x="690" y="10" width="90" height="50" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="735" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="735" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x64</text>

    <text x="535" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="635" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="735" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

</svg>
