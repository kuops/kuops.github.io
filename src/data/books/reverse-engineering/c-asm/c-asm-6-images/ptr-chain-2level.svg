<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">二级指针: **pp = 999 的三次解引用</text>

  <!-- Column headers -->
  <text x="20" y="62" font-size="12" font-weight="bold" fill="#64748b">C 语句</text>
  <text x="160" y="62" font-size="12" font-weight="bold" fill="#64748b">汇编</text>

  <!-- ============================================ -->
  <!-- PHASE 1: mov eax, [ebp-24] — read pp         -->
  <!-- ============================================ -->
  <g transform="translate(0, 75)">
    <text x="20" y="20" font-size="13" font-weight="bold" fill="#fbbf24">阶段 1</text>
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">pp</text>
    <text x="160" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">mov eax, [ebp-24]</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 pp → 得到 p 的地址</text>

    <!-- eax: 0x19FEE8 (p's address, read from pp!) -->
    <rect x="470" y="15" width="80" height="40" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="510" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- pp: 0x19FEE8 (stores p's address) -->
    <rect x="560" y="15" width="80" height="40" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="600" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- p: 0x19FEF4 (stores a's address) -->
    <rect x="650" y="15" width="80" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="690" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x2A -->
    <rect x="740" y="15" width="60" height="40" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="770" y="40" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="510" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="600" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-24] pp</text>
    <text x="690" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="770" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="155" x2="820" y2="155" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 2: mov ecx, [eax] — read p              -->
  <!-- ============================================ -->
  <g transform="translate(0, 170)">
    <text x="20" y="20" font-size="13" font-weight="bold" fill="#3b82f6">阶段 2</text>
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">*pp</text>
    <text x="160" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">mov ecx, [eax]</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 p → 得到 a 的地址</text>

    <!-- eax: 0x19FEE8 (unchanged, p's address) -->
    <rect x="470" y="15" width="80" height="40" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="510" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- ecx: 0x19FEF4 (a's address, read from p!) -->
    <rect x="560" y="15" width="80" height="40" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="600" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: 0x19FEF4 (unchanged) -->
    <rect x="650" y="15" width="80" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="690" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x2A -->
    <rect x="740" y="15" width="60" height="40" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="770" y="40" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="510" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="600" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="690" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="770" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="250" x2="820" y2="250" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 3: mov [ecx], 0x3E7 — write a           -->
  <!-- ============================================ -->
  <g transform="translate(0, 265)">
    <text x="20" y="20" font-size="13" font-weight="bold" fill="#10b981">阶段 3</text>
    <text x="20" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">**pp = 999</text>
    <text x="160" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">mov [ecx], 0x3E7</text>
    <text x="360" y="40" font-size="10" font-weight="bold" fill="#64748b">; 往 a 的地址写 999</text>

    <!-- eax: 0x19FEE8 (unchanged) -->
    <rect x="470" y="15" width="80" height="40" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="510" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- ecx: 0x19FEF4 (unchanged) -->
    <rect x="560" y="15" width="80" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="600" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: 0x19FEF4 (unchanged) -->
    <rect x="650" y="15" width="80" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="690" y="40" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x3E7 (overwritten!) -->
    <rect x="740" y="15" width="60" height="40" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="770" y="40" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">0x3E7</text>

    <text x="510" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="600" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="690" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="770" y="70" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

</svg>
