<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">二级指针: **pp = 999 的三次解引用</text>

  <!-- Column headers -->
  <text x="70" y="62" font-size="12" font-weight="bold" fill="#64748b">汇编</text>

  <!-- ============================================ -->
  <!-- PHASE 1: mov eax, [ebp-24] — read pp         -->
  <!-- ============================================ -->
  <g transform="translate(0, 75)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#fbbf24">阶段 1</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">mov eax, [ebp-24]</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 pp → p 的地址</text>

    <!-- eax: 0x19FEE8 (p's address, read!) -->
    <rect x="340" y="10" width="85" height="50" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="382" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="382" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- pp: addr 0x19FEDC, value 0x19FEE8 -->
    <rect x="435" y="10" width="85" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="477" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEDC</text>
    <text x="477" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- p: addr 0x19FEE8, value 0x19FEF4 -->
    <rect x="530" y="10" width="85" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="572" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="572" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: addr 0x19FEF4, value 0x2A -->
    <rect x="625" y="10" width="75" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="662" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="662" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="382" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="477" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-24] pp</text>
    <text x="572" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="662" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="165" x2="740" y2="165" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 2: mov ecx, [eax] — read p              -->
  <!-- ============================================ -->
  <g transform="translate(0, 180)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#3b82f6">阶段 2</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">mov ecx, [eax]</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 p → a 的地址</text>

    <!-- eax: 0x19FEE8 (unchanged) -->
    <rect x="340" y="10" width="85" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="382" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="382" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- ecx: 0x19FEF4 (a's address, read!) -->
    <rect x="435" y="10" width="85" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="477" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="477" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: unchanged -->
    <rect x="530" y="10" width="85" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="572" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="572" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: unchanged -->
    <rect x="625" y="10" width="75" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="662" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="662" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="382" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="477" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="572" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="662" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

  <line x1="20" y1="270" x2="740" y2="270" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 3: mov [ecx], 0x3E7 — write a           -->
  <!-- ============================================ -->
  <g transform="translate(0, 285)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#10b981">阶段 3</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">mov [ecx], 0x3E7</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 写 a = 999</text>

    <!-- eax: unchanged -->
    <rect x="340" y="10" width="85" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="382" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="382" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEE8</text>

    <!-- ecx: unchanged -->
    <rect x="435" y="10" width="85" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="477" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="477" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: unchanged -->
    <rect x="530" y="10" width="85" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="572" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="572" y="48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- a: 0x3E7 (overwritten!) -->
    <rect x="625" y="10" width="75" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="662" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="662" y="48" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0x3E7</text>

    <text x="382" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="477" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="572" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="662" y="78" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] a</text>
  </g>

</svg>
