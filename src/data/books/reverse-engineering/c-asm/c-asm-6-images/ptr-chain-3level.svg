<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">三级指针: ***ppp = 1234 的四次解引用</text>

  <!-- Column headers -->
  <text x="70" y="62" font-size="12" font-weight="bold" fill="#64748b">汇编</text>

  <!-- ============================================ -->
  <!-- PHASE 1: mov eax, [ebp-30] — read ppp        -->
  <!-- ============================================ -->
  <g transform="translate(0, 75)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#fbbf24">阶段 1</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">mov eax, [ebp-30]</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 ppp → pp 地址</text>

    <!-- eax: 0x19FEDC (pp's address, read!) -->
    <rect x="300" y="10" width="75" height="50" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="337" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="337" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEDC</text>

    <!-- ppp: addr 0x19FED0, value 0x19FEDC -->
    <rect x="380" y="10" width="75" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="417" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FED0</text>
    <text x="417" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEDC</text>

    <!-- pp: addr 0x19FEDC, value 0x19FEE8 -->
    <rect x="460" y="10" width="75" height="50" rx="4" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="497" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEDC</text>
    <text x="497" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#f59e0b">0x19FEE8</text>

    <!-- p: addr 0x19FEE8, value 0x19FEF4 -->
    <rect x="540" y="10" width="75" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="577" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="577" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- value: addr 0x19FEF4, value 0x2A -->
    <rect x="620" y="10" width="70" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="655" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="655" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="337" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="417" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-30] ppp</text>
    <text x="497" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-24] pp</text>
    <text x="577" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="655" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] value</text>
  </g>

  <line x1="20" y1="165" x2="740" y2="165" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 2: mov ecx, [eax] — read pp             -->
  <!-- ============================================ -->
  <g transform="translate(0, 180)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#f59e0b">阶段 2</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">mov ecx, [eax]</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 pp → p 地址</text>

    <!-- eax: unchanged -->
    <rect x="300" y="10" width="75" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="337" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="337" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEDC</text>

    <!-- ecx: 0x19FEE8 (p's address, read!) -->
    <rect x="380" y="10" width="75" height="50" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="417" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="417" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#f59e0b">0x19FEE8</text>

    <!-- pp: unchanged -->
    <rect x="460" y="10" width="75" height="50" rx="4" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="497" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEDC</text>
    <text x="497" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#f59e0b">0x19FEE8</text>

    <!-- p: unchanged -->
    <rect x="540" y="10" width="75" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="577" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="577" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- value: unchanged -->
    <rect x="620" y="10" width="70" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="655" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="655" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="337" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="417" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="497" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-24] pp</text>
    <text x="577" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="655" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] value</text>
  </g>

  <line x1="20" y1="270" x2="740" y2="270" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 3: mov edx, [ecx] — read p              -->
  <!-- ============================================ -->
  <g transform="translate(0, 285)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#3b82f6">阶段 3</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6">mov edx, [ecx]</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 读 p → value 地址</text>

    <!-- eax: unchanged -->
    <rect x="300" y="10" width="75" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="337" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="337" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEDC</text>

    <!-- ecx: unchanged -->
    <rect x="380" y="10" width="75" height="50" rx="4" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="417" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="417" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#f59e0b">0x19FEE8</text>

    <!-- edx: 0x19FEF4 (value's address, read!) -->
    <rect x="460" y="10" width="75" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="497" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">edx</text>
    <text x="497" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: unchanged -->
    <rect x="540" y="10" width="75" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="577" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="577" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- value: unchanged -->
    <rect x="620" y="10" width="70" height="50" rx="4" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="655" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="655" y="48" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">0x2A</text>

    <text x="337" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="417" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="497" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">edx</text>
    <text x="577" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="655" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] value</text>
  </g>

  <line x1="20" y1="375" x2="740" y2="375" stroke="#64748b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- PHASE 4: mov [edx], 0x4D2 — write value       -->
  <!-- ============================================ -->
  <g transform="translate(0, 390)">
    <text x="10" y="40" font-size="13" font-weight="bold" fill="#10b981">阶段 4</text>
    <text x="70" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">mov [edx], 0x4D2</text>
    <text x="190" y="40" font-size="10" font-weight="bold" fill="#64748b">; 写 value = 1234</text>

    <!-- eax: unchanged -->
    <rect x="300" y="10" width="75" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="337" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="337" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#fbbf24">0x19FEDC</text>

    <!-- ecx: unchanged -->
    <rect x="380" y="10" width="75" height="50" rx="4" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="417" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="417" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#f59e0b">0x19FEE8</text>

    <!-- edx: unchanged -->
    <rect x="460" y="10" width="75" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="497" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">edx</text>
    <text x="497" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- p: unchanged -->
    <rect x="540" y="10" width="75" height="50" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="577" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEE8</text>
    <text x="577" y="48" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x19FEF4</text>

    <!-- value: 0x4D2 (overwritten!) -->
    <rect x="620" y="10" width="70" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="655" y="28" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">0x19FEF4</text>
    <text x="655" y="48" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981">0x4D2</text>

    <text x="337" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">eax</text>
    <text x="417" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">ecx</text>
    <text x="497" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">edx</text>
    <text x="577" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-18] p</text>
    <text x="655" y="78" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-C] value</text>
  </g>

</svg>
