<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">动态内存: malloc 申请, p[i] 偏移访问, free 释放</text>

  <!-- ========== Left: Stack ========== -->
  <text x="60" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">栈</text>

  <text x="20" y="88" font-family="monospace" font-size="12" font-weight="bold" fill="#64748b">ebp</text>
  <line x1="20" y1="93" x2="200" y2="93" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- p: [ebp-8] on stack, stores heap address -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="160" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="20" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">p = 0x00AB1230</text>
    <text x="80" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-8] (存堆地址)</text>
  </g>

  <!-- arrow from stack p to heap -->
  <path d="M 200 125 L 385 125" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="381,121 385,125 381,129" fill="#3b82f6"/>
  <text x="290" y="118" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">指向堆</text>

  <!-- ========== Right: Heap ========== -->
  <text x="550" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">堆 (malloc 返回的 16 字节)</text>

  <!-- heap block: 4 int cells -->
  <!-- p[0] -->
  <g transform="translate(390, 95)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="40" y="22" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">100</text>
    <text x="40" y="42" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[0]</text>
  </g>
  <!-- p[1] -->
  <g transform="translate(470, 95)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="40" y="22" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">200</text>
    <text x="40" y="42" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[1]</text>
  </g>
  <!-- p[2] -->
  <g transform="translate(550, 95)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="40" y="22" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">300</text>
    <text x="40" y="42" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[2]</text>
  </g>
  <!-- p[3] -->
  <g transform="translate(630, 95)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="40" y="22" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">400</text>
    <text x="40" y="42" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[3]</text>
  </g>

  <!-- heap address labels -->
  <text x="430" y="160" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">0x00AB1230</text>
  <text x="510" y="160" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+4</text>
  <text x="590" y="160" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+8</text>
  <text x="670" y="160" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+12</text>

  <!-- ========== p[i] addressing explanation ========== -->
  <g transform="translate(40, 190)">
    <rect x="0" y="0" width="420" height="70" rx="6" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="22" font-size="13" font-weight="bold" fill="#3b82f6">p[i] = *(p + i) = [edx + i*4]</text>
    <text x="10" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">mov edx, [ebp-8]   ; 读 p (堆地址)</text>
    <text x="10" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">mov [edx+ecx], 0x64 ; p[0] = 100</text>
  </g>

  <!-- ========== malloc / free flow ========== -->
  <g transform="translate(490, 190)">
    <rect x="0" y="0" width="310" height="70" rx="6" fill="#94a3b8" fill-opacity="0.05" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="10" y="22" font-size="13" font-weight="bold" fill="#94a3b8">malloc / free 流程</text>
    <text x="10" y="42" font-size="11" font-weight="bold" fill="#64748b">1. malloc(16) → eax = 堆地址</text>
    <text x="10" y="58" font-size="11" font-weight="bold" fill="#64748b">2. p = eax (存到栈上)</text>
    <text x="10" y="74" font-size="11" font-weight="bold" fill="#64748b">3. free(p) → 堆回收, p 值不变</text>
  </g>

  <!-- ========== UAF warning ========== -->
  <g transform="translate(40, 295)">
    <rect x="0" y="0" width="770" height="95" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="22" font-size="13" font-weight="bold" fill="#ef4444">free(p) 之后: p 的值还在栈上, 但堆内存已释放</text>
    <text x="10" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">free(p)       ; 堆块归还系统</text>
    <text x="10" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">mov ecx, [ebp-8]  ; p 还是那个地址!</text>
    <text x="10" y="79" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">mov eax, [ecx]    ; 危险! 读已释放的内存 (UAF)</text>
  </g>

</svg>
