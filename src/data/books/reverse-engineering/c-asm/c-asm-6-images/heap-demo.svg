<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">动态内存: malloc 申请, p[i] 写入, free 释放</text>

  <!-- ========== 左侧:栈 ========== -->
  <text x="80" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">栈</text>

  <!-- ebp 参考线 -->
  <text x="20" y="88" font-family="monospace" font-size="12" font-weight="bold" fill="#64748b">ebp</text>
  <line x1="20" y1="93" x2="170" y2="93" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- p 格子: [ebp-8], 存堆地址 -->
  <rect x="40" y="100" width="130" height="50" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="105" y="120" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">0x00AB1230</text>
  <text x="105" y="140" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">[ebp-8] p</text>

  <!-- 箭头: p → 堆首格 -->
  <path d="M 170 125 L 305 125" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="301,121 305,125 301,129" fill="#3b82f6"/>
  <text x="237" y="118" font-size="11" font-weight="bold" text-anchor="middle" fill="#3b82f6">指向堆</text>

  <!-- ========== 右侧:堆 ========== -->
  <text x="510" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">堆 (malloc 返回的 16 字节)</text>

  <!-- p[0]: 100 (已写入, 绿色高亮) -->
  <rect x="310" y="100" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="350" y="122" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">100</text>
  <text x="350" y="142" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[0]</text>

  <!-- p[1]: 200 (已写入, 绿色高亮) -->
  <rect x="390" y="100" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="430" y="122" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">200</text>
  <text x="430" y="142" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[1]</text>

  <!-- p[2]: 300 (已写入, 绿色高亮) -->
  <rect x="470" y="100" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="510" y="122" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">300</text>
  <text x="510" y="142" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[2]</text>

  <!-- p[3]: 400 (已写入, 绿色高亮) -->
  <rect x="550" y="100" width="80" height="50" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="590" y="122" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">400</text>
  <text x="590" y="142" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">p[3]</text>

  <!-- 堆地址标注 -->
  <text x="350" y="168" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">0x00AB1230</text>
  <text x="430" y="168" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+4</text>
  <text x="510" y="168" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+8</text>
  <text x="590" y="168" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#64748b">+12</text>

  <!-- ========== 汇编: malloc → p[i] → free ========== -->
  <g transform="translate(40, 195)">
    <text x="0" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#3b82f6">push 0x10</text>
    <text x="110" y="0" font-size="11" font-weight="bold" fill="#64748b">; malloc(16)</text>

    <text x="0" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#3b82f6">call _malloc</text>
    <text x="110" y="20" font-size="11" font-weight="bold" fill="#64748b">; eax = 堆地址</text>

    <text x="0" y="40" font-family="monospace" font-size="12" font-weight="bold" fill="#3b82f6">mov [ebp-8], eax</text>
    <text x="160" y="40" font-size="11" font-weight="bold" fill="#64748b">; p = 堆地址 (存到栈上)</text>

    <text x="0" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">mov [edx+ecx], 0x64</text>
    <text x="160" y="62" font-size="11" font-weight="bold" fill="#64748b">; p[0] = 100 ([edx + i*4])</text>

    <text x="0" y="82" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">call _free</text>
    <text x="110" y="82" font-size="11" font-weight="bold" fill="#64748b">; 堆块归还系统</text>
  </g>

  <!-- ========== UAF 标注 ========== -->
  <g transform="translate(490, 195)">
    <rect x="0" y="0" width="310" height="95" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="22" font-size="13" font-weight="bold" fill="#ef4444">free(p) 之后</text>
    <text x="10" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">mov ecx, [ebp-8]  ; p 还是那个地址</text>
    <text x="10" y="65" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">mov eax, [ecx]    ; 但堆内存已释放</text>
    <text x="10" y="85" font-size="11" font-weight="bold" fill="#ef4444">→ 释放后使用 (UAF): p 值不变, 堆已不归你</text>
  </g>

</svg>
