<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">不连续 switch 跳转流程 (x = 3, 没有 case 3)</text>

  <!-- ========== Left column: dispatch logic ========== -->

  <!-- Box 1: mov eax, [ebp+8] -->
  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">        </text>
    <text x="20" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">mov eax, dword ptr [ebp+8]</text>
  </g>
  <!-- arrow -->
  <line x1="195" y1="85" x2="195" y2="99" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="191,93 195,99 199,93" fill="#10b981"/>
  <text x="205" y="96" font-size="11" font-weight="bold" fill="#64748b">eax = 3</text>

  <!-- Box 2: sub ecx, 1 -->
  <g transform="translate(40, 99)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">sub ecx, 1</text>
  </g>
  <!-- arrow -->
  <line x1="195" y1="129" x2="195" y2="143" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="191,137 195,143 199,137" fill="#10b981"/>
  <text x="205" y="140" font-size="11" font-weight="bold" fill="#64748b">ecx = 3-1 = 2 (索引)</text>

  <!-- Box 3: cmp -->
  <g transform="translate(40, 143)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">cmp dword ptr [ebp-0xC4], 4</text>
  </g>

  <!-- Box 3b: ja (executed, but jump not taken) -->
  <g transform="translate(40, 187)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">ja  default_case</text>
  </g>

  <!-- ja taken (dashed line to default_case, not executed) -->
  <path d="M 350 202 L 390 202 Q 395 202 395 207 L 395 450 Q 395 455 390 455 L 354 455" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="358,451 354,455 358,459" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- Box 4: jmp dword ptr [edx*4+table] -->
  <g transform="translate(40, 231)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#3b82f6">jmp dword ptr [edx*4+0x004B4F68]</text>
  </g>

  <!-- ja to jmp: green arrow (direct, boxes are adjacent) -->
  <line x1="195" y1="217" x2="195" y2="231" stroke="#10b981" stroke-width="2"/>
  <polygon points="191,225 195,231 199,225" fill="#10b981"/>

  <!-- ========== Jump table (right side) ========== -->

  <!-- Table title -->
  <text x="530" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">跳转表 (0x004B4F68)</text>

  <!-- Table header -->
  <text x="430" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">地址</text>
  <text x="520" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">小端序字节</text>
  <text x="640" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">指向</text>
  <line x1="380" y1="95" x2="710" y2="95" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Entry 0: case_1 (x=1) -->
  <text x="430" y="120" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">+00</text>
  <text x="520" y="120" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">10 4F 4B 00</text>
  <text x="640" y="120" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">0x004B4F10</text>

  <!-- Entry 1: case_2 (x=2) -->
  <text x="430" y="148" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">+04</text>
  <text x="520" y="148" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">20 4F 4B 00</text>
  <text x="640" y="148" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">0x004B4F20</text>

  <!-- Entry 2: HIGHLIGHTED (x=3 hole -> default) -->
  <rect x="385" y="156" width="320" height="28" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="430" y="176" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#ef4444">+08</text>
  <text x="520" y="176" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#ef4444">50 4F 4B 00</text>
  <text x="640" y="176" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#ef4444">0x004B4F50</text>

  <!-- Entry 3: case_4 (x=4) -->
  <text x="430" y="204" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">+0C</text>
  <text x="520" y="204" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">30 4F 4B 00</text>
  <text x="640" y="204" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">0x004B4F30</text>

  <!-- Entry 4: case_5 (x=5) -->
  <text x="430" y="232" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">+10</text>
  <text x="520" y="232" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">40 4F 4B 00</text>
  <text x="640" y="232" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">0x004B4F40</text>

  <!-- Annotation on index 2 -->
  <text x="725" y="148" font-size="11" font-weight="bold" fill="#ef4444">x=3 没有对应 case</text>
  <text x="725" y="162" font-size="11" font-weight="bold" fill="#ef4444">表里填 default 地址</text>

  <!-- Arrow from jmp box to table entry 2 (bottom edge of red highlight) -->
  <path d="M 350 246 L 393 246 Q 399 246 399 240 L 399 190" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="395,190 399,184 403,190" fill="#3b82f6"/>
  <text x="405" y="260" font-size="11" font-weight="bold" fill="#3b82f6">edx=2</text>
  <text x="405" y="273" font-size="11" font-weight="bold" fill="#3b82f6">查索引 2</text>

  <!-- Arrow from table entry 2 (default) curving down to default_case box right edge -->
  <path d="M 705 170 L 725 170 Q 730 170 730 175 L 730 450 Q 730 455 725 455 L 354 455" fill="none" stroke="#ef4444" stroke-width="2"/>
  <polygon points="358,451 354,455 358,459" fill="#ef4444"/>
  <text x="740" y="320" font-size="11" font-weight="bold" fill="#ef4444">跳到 default</text>

  <!-- ========== Bottom: case blocks ========== -->

  <!-- Section label -->
  <text x="20" y="290" font-size="13" font-weight="bold" fill="#94a3b8">各 case 代码块</text>

  <!-- case_1 -->
  <g transform="translate(40, 300)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">case_1: mov eax, 0x64 ; return 100</text>
  </g>

  <!-- case_2 -->
  <g transform="translate(40, 334)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">case_2: mov eax, 0xC8 ; return 200</text>
  </g>

  <!-- case_4 -->
  <g transform="translate(40, 368)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">case_4: mov eax, 0x190 ; return 400</text>
  </g>

  <!-- case_5 -->
  <g transform="translate(40, 402)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8">case_5: mov eax, 0x1F4 ; return 500</text>
  </g>

  <!-- default_case: HIGHLIGHTED -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="10" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#ef4444">default_case: or eax, 0xFFFFFFFF</text>
  </g>

  <!-- end -->
  <g transform="translate(40, 490)">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="135" y="20" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#94a3b8">end:</text>
  </g>

  <!-- Arrow from default_case to end -->
  <line x1="195" y1="470" x2="195" y2="490" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="191,484 195,490 199,484" fill="#ef4444"/>
  <text x="205" y="485" font-size="11" font-weight="bold" fill="#ef4444">return -1</text>

  <!-- Arrows from each case to end (jmp end) -->
  <path d="M 350 315 L 376 315 Q 380 315 380 319 L 380 501 Q 380 505 376 505 L 354 505" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="358,501 354,505 358,509" fill="#94a3b8" fill-opacity="0.3"/>

  <path d="M 350 349 L 376 349 Q 380 349 380 353 L 380 501 Q 380 505 376 505 L 354 505" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="358,501 354,505 358,509" fill="#94a3b8" fill-opacity="0.3"/>

  <path d="M 350 383 L 376 383 Q 380 383 380 387 L 380 501 Q 380 505 376 505 L 354 505" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="358,501 354,505 358,509" fill="#94a3b8" fill-opacity="0.3"/>

  <path d="M 350 417 L 376 417 Q 380 417 380 421 L 380 501 Q 380 505 376 505 L 354 505" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="358,501 354,505 358,509" fill="#94a3b8" fill-opacity="0.3"/>

  <!-- ========== Summary box ========== -->
  <g transform="translate(40, 550)">
    <rect x="0" y="0" width="440" height="80" rx="6" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="220" y="28" font-size="14" font-weight="bold" text-anchor="middle" fill="#60a5fa">x = 3 的完整路径</text>
    <text x="20" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">sub 1 → 索引 2 → 范围检查通过</text>
    <text x="20" y="70" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">→ 查表索引 2 → 表里是 default → return -1</text>
  </g>

</svg>
