<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 328" width="100%" height="100%" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14">

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#94a3b8">部分重写: Dog 只重写 speak, get_tag 继承自 Animal (32 位)</text>

  <!-- 左侧: Dog 对象内存 -->
  <text x="80" y="62" font-size="12" font-weight="bold" fill="#94a3b8">Dog 对象内存</text>

  <g transform="translate(80, 70)">
    <!-- vptr: offset +0 -->
    <rect x="0" y="0" width="180" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="90" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">vptr</text>
    <text x="90" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">4 字节指针</text>
  </g>

  <!-- 偏移标签 -->
  <g transform="translate(30, 70)">
    <text x="0" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b">+0</text>
  </g>

  <!-- 箭头: vptr -> vtable for Dog -->
  <line x1="260" y1="94" x2="454" y2="94" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="450,90 458,94 450,98" fill="#3b82f6"/>
  <text x="355" y="88" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">vptr 指向</text>

  <!-- 右上: vtable for Dog -->
  <text x="460" y="62" font-size="12" font-weight="bold" fill="#94a3b8">vtable for Dog</text>

  <g transform="translate(460, 70)">
    <!-- vtable[0]: speak (重写, 绿色) -->
    <rect x="0" y="0" width="320" height="48" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="160" y="22" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">[0] = &amp;Dog::speak</text>
    <text x="160" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#10b981">重写 override</text>

    <!-- vtable[4]: get_tag (没重写, 灰色) -->
    <rect x="0" y="48" width="320" height="48" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="160" y="70" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#94a3b8">[4] = &amp;Animal::get_tag</text>
    <text x="160" y="88" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#94a3b8">继承, 未重写</text>
  </g>

  <!-- 右下: vtable for Animal (参照) -->
  <text x="460" y="200" font-size="12" font-weight="bold" fill="#94a3b8">vtable for Animal (参照)</text>

  <g transform="translate(460, 208)">
    <!-- vtable[0]: speak -->
    <rect x="0" y="0" width="320" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="160" y="22" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">[0] = &amp;Animal::speak</text>
    <text x="160" y="40" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">函数地址 (4 字节)</text>

    <!-- vtable[4]: get_tag -->
    <rect x="0" y="48" width="320" height="48" rx="4" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="160" y="70" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#3b82f6">[4] = &amp;Animal::get_tag</text>
    <text x="160" y="88" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#3b82f6">函数地址 (4 字节)</text>
  </g>

</svg>
